<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Egg Heist - Sneaky Fox Stealth Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2f6b2f;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,40,10,.62);padding:12px;overflow:auto;z-index:8}
.card{text-align:center;max-width:400px;width:100%}
h1{margin:0 0 6px;font-size:clamp(2rem,9vw,3.2rem);text-shadow:0 4px 0 rgba(0,0,0,.35)}
#msg{margin:0 0 8px;font-size:1.1rem}
#stats{font-size:1.15rem;font-weight:800;line-height:1.7;margin-bottom:8px}
#go{border:0;border-radius:18px;font:inherit;font-weight:800;font-size:1.5rem;padding:14px 44px;color:#fff;background:#e8761f;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.how{margin:14px 0 0;font-size:.93rem;line-height:1.6;opacity:.95}
.sb{position:fixed;top:4px;border:0;border-radius:50%;width:36px;height:36px;font-size:1rem;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;z-index:5}
#mute{right:6px}#mus{right:48px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="sb" id="mus" aria-label="Music">🎵</button>
<button class="sb" id="mute" aria-label="Sound effects">🔔</button>
<div id="ov">
  <div class="card">
    <h1>🦊 Egg Heist</h1>
    <p id="msg">Sneak into the farm, steal every egg and run back to your den!</p>
    <div id="stats"></div>
    <button id="go">▶ Start Sneaking</button>
    <p class="how">Move: arrow keys / W A S D, or drag your finger on the screen<br>Stay out of the farmers' yellow vision cones and hide in bushes<br>Dogs can smell you, so keep your distance!<br>Golden eggs are worth extra points</p>
  </div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, D = 1, S = 1, offX = 0, offY = 44;
  var VW = 640, VH = 640, TOP = 44;
  var st = 'title', level = 0, lives = 3, score = 0, best = +ls('eh_best') || 0;
  var pl = { x: 56, y: 540, r: 10, face: -1, hide: 0 }, den = { x: 56, y: 598, r: 26 };
  var walls = [], bushes = [], eggs = [], farmers = [], dogs = [];
  var alertV = 0, elapsed = 0, got = 0, total = 0, gotAll = false, stealth = true, timer = 0, msg = '', msgT = 0, shake = 0, t = 0;
  var keys = { x: 0, y: 0 }, joy = null;
  var ac = null, muted = false, musicOn = true, mt = null, mstep = 0, warned = false;

  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sv(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rngf(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

  function resize() {
    D = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * D; cv.height = H * D; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    S = Math.max(.3, Math.min(W / VW, (H - TOP) / VH));
    offX = (W - VW * S) / 2; offY = TOP + Math.max(0, (H - TOP - VH * S) * .25);
  }
  window.addEventListener('resize', resize); resize();

  /* ================= SOUND ================= */
  function actx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, d, type, vol, f2, delay) {
    if (muted || !actx()) return;
    var o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + (delay || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f, s);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol || .08, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d + .02);
  }
  function noise(d, vol) {
    if (muted || !actx()) return;
    var n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
    for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = vol || .3;
    s.connect(g); g.connect(ac.destination); s.start();
  }
  function seq(a, d, type, vol, gap) { a.forEach(function (f, i) { tone(f, d, type, vol, 0, i * gap); }); }
  var sfx = {
    egg: function () { tone(660, .08, 'square', .07, 990); tone(1320, .12, 'square', .06, 0, .08); },
    gold: function () { seq([784, 988, 1175, 1568, 1976], .12, 'triangle', .09, .07); },
    warn: function () { tone(520, .14, 'sawtooth', .07, 780); },
    bark: function () { noise(.07, .25); tone(190, .12, 'square', .08, 110); },
    caught: function () { noise(.3, .3); seq([523, 440, 349, 262, 196], .16, 'sawtooth', .07, .1); },
    all: function () { seq([523, 659, 784, 1047], .1, 'square', .06, .08); },
    win: function () { seq([523, 659, 784, 1047, 784, 1047, 1319, 1568], .16, 'square', .06, .12); },
    over: function () { seq([392, 330, 262, 196], .3, 'sawtooth', .07, .3); }
  };
  var MEL = [0, 3, 7, 3, 5, 8, 12, 8, 0, 3, 7, 10, 5, 3, 2, null];
  function music(on) {
    clearInterval(mt); mt = null;
    if (!on || !musicOn) return;
    mstep = 0;
    mt = setInterval(function () {
      if (muted || !ac || st !== 'play') return;
      var n = MEL[mstep % 16];
      if (n !== null) tone(220 * Math.pow(2, n / 12), .12, 'triangle', .06);
      if (mstep % 4 === 0) tone(110 * Math.pow(2, (mstep % 8 === 0 ? 0 : -2) / 12), .45, 'sine', .08);
      mstep++;
    }, 230);
  }

  /* ================= LEVEL ================= */
  function ov(a, b, m) { return !(a.x > b.x + b.w + m || a.x + a.w < b.x - m || a.y > b.y + b.h + m || a.y + a.h < b.y - m); }
  function circRect(x, y, r, w) { var nx = clamp(x, w.x, w.x + w.w), ny = clamp(y, w.y, w.y + w.h); return Math.hypot(x - nx, y - ny) < r; }
  function segRect(x1, y1, x2, y2, w) {
    var dx = x2 - x1, dy = y2 - y1, t0 = 0, t1 = 1, p = [-dx, dx, -dy, dy], q = [x1 - w.x, w.x + w.w - x1, y1 - w.y, w.y + w.h - y1], i;
    for (i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else { var u = q[i] / p[i]; if (p[i] < 0) { if (u > t1) return false; if (u > t0) t0 = u; } else { if (u < t0) return false; if (u < t1) t1 = u; } }
    }
    return true;
  }
  function los(x1, y1, x2, y2) { for (var i = 0; i < walls.length; i++) if (segRect(x1, y1, x2, y2, walls[i])) return false; return true; }
  function infl(w, m) { return { x: w.x - m, y: w.y - m, w: w.w + 2 * m, h: w.h + 2 * m }; }

  function genLevel(n) {
    var rng = rngf(1000 + n * 77), i, k;
    walls = []; bushes = []; eggs = []; farmers = []; dogs = [];
    var nw = 4 + Math.min(5, n);
    for (k = 0; k < 300 && walls.length < nw; k++) {
      var hz = rng() < .5, w = hz ? 70 + rng() * 110 : 20 + rng() * 8, h = hz ? 20 + rng() * 8 : 70 + rng() * 110;
      var r = { x: 50 + rng() * (VW - 100 - w), y: 50 + rng() * (VH - 120 - h), w: w, h: h };
      if (ov(r, { x: 0, y: 470, w: 200, h: 170 }, 0)) continue;
      if (walls.some(function (o) { return ov(r, o, 46); })) continue;
      walls.push(r);
    }
    function free(rad, minStart, minOther, others) {
      for (var a = 0; a < 200; a++) {
        var x = 30 + rng() * (VW - 60), y = 30 + rng() * (VH - 60);
        if (Math.hypot(x - 56, y - 560) < minStart) continue;
        if (walls.some(function (w) { return circRect(x, y, rad + 12, w); })) continue;
        if (others && others.some(function (o) { return Math.hypot(x - o.x, y - o.y) < minOther; })) continue;
        return { x: x, y: y };
      }
      return { x: 320, y: 320 };
    }
    total = Math.min(9, 3 + n);
    for (i = 0; i < total; i++) { var p = free(10, 140, 70, eggs); p.gold = (i === total - 1 && n >= 1); eggs.push(p); }
    var nb = 5 + Math.min(3, n);
    for (i = 0; i < nb; i++) bushes.push(Object.assign(free(26, 90, 60, bushes), { r: 24 + rng() * 8 }));
    var nf = Math.min(3, 1 + Math.floor(n / 2));
    for (i = 0; i < nf; i++) {
      var wps = null;
      for (k = 0; k < 80 && !wps; k++) {
        var cand = [free(14, 200, 0), free(14, 200, 0), free(14, 200, 0)], ok = true;
        for (var a = 0; a < 3 && ok; a++) { var A = cand[a], B = cand[(a + 1) % 3]; if (walls.some(function (w) { return segRect(A.x, A.y, B.x, B.y, infl(w, 14)); })) ok = false; }
        if (ok) wps = cand;
      }
      if (!wps) { var q = free(14, 200, 0); wps = [q]; }
      farmers.push({ x: wps[0].x, y: wps[0].y, wps: wps, i: 1 % wps.length, face: rng() * 6.28, speed: Math.min(80, 50 + n * 4), pause: 0, seeing: 0 });
    }
    var nd = n >= 2 ? (n >= 5 ? 2 : 1) : 0;
    for (i = 0; i < nd; i++) { var d = free(10, 220, 0); dogs.push({ x: d.x, y: d.y, tx: d.x, ty: d.y, wt: 0, chase: 0, bark: 0 }); }
    pl.x = 56; pl.y = 548; pl.face = -1.57; got = 0; gotAll = false; alertV = 0; elapsed = 0; stealth = true; warned = false;
    timer = 110; st = 'intro'; msg = 'Level ' + (n + 1) + ': steal ' + total + ' eggs!'; msgT = 110;
  }

  /* ================= LOGIC ================= */
  function resolve(o, r) {
    for (var k = 0; k < 2; k++) walls.forEach(function (w) {
      var nx = clamp(o.x, w.x, w.x + w.w), ny = clamp(o.y, w.y, w.y + w.h), dx = o.x - nx, dy = o.y - ny, d = Math.hypot(dx, dy);
      if (d < r) { if (d > .001) { o.x += dx / d * (r - d); o.y += dy / d * (r - d); } else o.y -= r; }
    });
    o.x = clamp(o.x, r, VW - r); o.y = clamp(o.y, r, VH - r);
  }
  function angDiff(a, b) { var d = a - b; return Math.atan2(Math.sin(d), Math.cos(d)); }

  function caught() {
    if (st !== 'play') return;
    st = 'caught'; timer = 0; shake = 1; sfx.caught(); music(false);
  }
  function addScore(n) { score += n; }

  function update(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
    if (msgT > 0) msgT--;
    if (st === 'intro') { if (--timer <= 0) { st = 'play'; music(true); } return; }
    if (st === 'caught') {
      timer += dt;
      if (timer > 1.4) {
        lives--;
        if (lives < 0) {
          st = 'over'; sfx.over(); if (score > best) { best = score; sv('eh_best', best); }
          $('msg').textContent = 'The farmer caught you!'; $('stats').innerHTML = 'Score: ' + score + '<br>Level reached: ' + (level + 1) + '<br>🏅 Best: ' + best;
          $('go').textContent = '↻ Try again'; $('ov').style.display = 'flex';
        } else genLevel(level);
      }
      return;
    }
    if (st === 'clear') { timer += dt; if (timer > 2.2) { level++; genLevel(level); } return; }
    if (st !== 'play') return;
    elapsed += dt;
    var ix = keys.x, iy = keys.y;
    if (joy) { var dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy); if (m > 6) { var f = Math.min(1, m / 40); ix = dx / m * f; iy = dy / m * f; } }
    var mag = Math.hypot(ix, iy); if (mag > 1) { ix /= mag; iy /= mag; }
    pl.x += ix * 125 * dt; pl.y += iy * 125 * dt; resolve(pl, pl.r);
    if (mag > .1) pl.face = Math.atan2(iy, ix);
    pl.hide = bushes.some(function (b) { return Math.hypot(pl.x - b.x, pl.y - b.y) < b.r - 4; }) ? 1 : 0;

    var rate = 0;
    farmers.forEach(function (f) {
      f.seeing = 0;
      if (f.pause > 0) { f.pause -= dt; f.face += Math.sin(t * 3 + f.i) * dt * 1.5; }
      else {
        var wp = f.wps[f.i], dx = wp.x - f.x, dy = wp.y - f.y, d = Math.hypot(dx, dy);
        if (d < 3) { f.i = (f.i + 1) % f.wps.length; f.pause = .9; }
        else { f.x += dx / d * f.speed * dt; f.y += dy / d * f.speed * dt; f.face += angDiff(Math.atan2(dy, dx), f.face) * Math.min(1, 8 * dt); }
      }
      var ddx = pl.x - f.x, ddy = pl.y - f.y, dist = Math.hypot(ddx, ddy), range = pl.hide ? 38 : 150;
      if (dist < range && (dist < 22 || Math.abs(angDiff(Math.atan2(ddy, ddx), f.face)) < .56) && los(f.x, f.y, pl.x, pl.y)) { f.seeing = 1; rate = Math.max(rate, 1.5 * (1.2 - dist / range * .5)); }
    });
    dogs.forEach(function (g) {
      var dist = Math.hypot(pl.x - g.x, pl.y - g.y), sp = 62;
      if (g.bark > 0) g.bark -= dt;
      if (g.chase > 0) { g.chase -= dt; g.tx = pl.x; g.ty = pl.y; sp = 98; }
      else {
        g.wt -= dt;
        if (g.wt <= 0 || Math.hypot(g.tx - g.x, g.ty - g.y) < 6) { g.tx = clamp(g.x + (Math.random() - .5) * 300, 20, VW - 20); g.ty = clamp(g.y + (Math.random() - .5) * 300, 20, VH - 20); g.wt = 2 + Math.random() * 2; }
        if (dist < 100 && !pl.hide && los(g.x, g.y, pl.x, pl.y)) { g.chase = 2.5; if (g.bark <= 0) { sfx.bark(); g.bark = 3; } }
      }
      var dx = g.tx - g.x, dy = g.ty - g.y, d = Math.hypot(dx, dy);
      if (d > 1) { g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; g.face = Math.atan2(dy, dx); resolve(g, 9); }
      if (dist < 55) rate = Math.max(rate, 2.4);
      if (dist < 17) alertV = 1;
    });
    if (rate > 0) { alertV += rate * dt; if (alertV > .5) stealth = false; if (!warned && alertV > .2) { warned = true; sfx.warn(); } }
    else { alertV = Math.max(0, alertV - .7 * dt); if (alertV < .05) warned = false; }
    if (alertV >= 1) { alertV = 1; caught(); return; }

    for (var i = eggs.length - 1; i >= 0; i--) {
      var e = eggs[i];
      if (Math.hypot(pl.x - e.x, pl.y - e.y) < 17) {
        eggs.splice(i, 1); got++; if (e.gold) { addScore(300); sfx.gold(); } else { addScore(100); sfx.egg(); }
        if (got >= total) { gotAll = true; msg = 'All eggs stolen! Run to your den!'; msgT = 130; sfx.all(); }
      }
    }
    if (gotAll && Math.hypot(pl.x - den.x, pl.y - den.y) < den.r) {
      var tb = Math.max(0, Math.floor((70 - elapsed) * 10)), sb = stealth ? 200 : 0;
      addScore(tb + sb + 150); msg = 'Level complete! Time +' + tb + (sb ? '  Stealth +200' : ''); msgT = 150;
      st = 'clear'; timer = 0; sfx.win(); music(false);
      if (score > best) { best = score; sv('eh_best', best); }
    }
  }

  /* ================= DRAW ================= */
  function ell(x, y, rx, ry, c) { cx.fillStyle = c; cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, 7); cx.fill(); }
  function drawFox() {
    cx.save(); cx.translate(pl.x, pl.y); cx.rotate(pl.face);
    ell(-12, 0, 10, 5, '#e8761f'); ell(-19, 0, 4, 3, '#fff');
    ell(0, 0, 11, 8, '#f08a2c'); ell(8, 0, 7, 6, '#f08a2c');
    cx.fillStyle = '#f08a2c'; cx.beginPath(); cx.moveTo(8, -4); cx.lineTo(4, -12); cx.lineTo(13, -6); cx.fill(); cx.beginPath(); cx.moveTo(8, 4); cx.lineTo(4, 12); cx.lineTo(13, 6); cx.fill();
    ell(14, 0, 3, 2.5, '#fff'); ell(16, 0, 1.6, 1.6, '#000'); ell(10, -3, 1.3, 1.3, '#000'); ell(10, 3, 1.3, 1.3, '#000');
    cx.restore();
  }
  function drawFarmer(f) {
    cx.fillStyle = f.seeing ? 'rgba(255,60,60,.32)' : 'rgba(255,240,90,.2)';
    cx.beginPath(); cx.moveTo(f.x, f.y); cx.arc(f.x, f.y, 150, f.face - .56, f.face + .56); cx.closePath(); cx.fill();
    ell(f.x, f.y + 3, 12, 6, 'rgba(0,0,0,.25)');
    ell(f.x, f.y, 11, 11, '#2d5fc0'); ell(f.x, f.y, 7, 7, '#ffcf9f');
    ell(f.x, f.y, 15, 15, 'rgba(0,0,0,0)'); cx.fillStyle = '#e0b84a'; cx.beginPath(); cx.ellipse(f.x, f.y, 14, 12, 0, 0, 7); cx.fill(); ell(f.x, f.y, 7, 7, '#f1d36a');
    cx.fillStyle = '#222'; cx.beginPath(); cx.arc(f.x + Math.cos(f.face) * 12, f.y + Math.sin(f.face) * 12, 2.5, 0, 7); cx.fill();
    if (f.seeing) { cx.fillStyle = '#ff3030'; cx.font = 'bold 22px sans-serif'; cx.textAlign = 'center'; cx.fillText('!', f.x, f.y - 20); }
  }
  function drawDog(g) {
    cx.save(); cx.translate(g.x, g.y); cx.rotate(g.face || 0);
    ell(0, 0, 11, 6, '#8a5a2b'); ell(10, 0, 6, 5, '#a26a35'); ell(14, 0, 2, 2, '#000'); ell(-11, Math.sin(t * 14) * 2, 5, 2, '#8a5a2b');
    ell(8, -5, 3, 2, '#5c3a18'); ell(8, 5, 3, 2, '#5c3a18');
    cx.restore();
    if (g.chase > 0) { cx.fillStyle = '#ff3030'; cx.font = 'bold 18px sans-serif'; cx.textAlign = 'center'; cx.fillText('!', g.x, g.y - 14); }
  }

  function draw() {
    cx.setTransform(D, 0, 0, D, 0, 0);
    cx.fillStyle = '#2b5f2b'; cx.fillRect(0, 0, W, H);
    cx.save();
    cx.setTransform(D * S, 0, 0, D * S, D * offX + (shake > 0 ? (Math.random() - .5) * shake * 10 * D : 0), D * offY);
    cx.fillStyle = '#5fae4b'; cx.fillRect(0, 0, VW, VH);
    cx.fillStyle = '#56a443'; for (var y = 0; y < VH; y += 80) cx.fillRect(0, y, VW, 40);
    var pulse = gotAll ? Math.abs(Math.sin(t * 5)) : 0;
    ell(den.x, den.y - 4, den.r + 6, den.r, '#8a6a3a'); ell(den.x, den.y - 4, den.r - 2, den.r - 6, gotAll ? 'rgb(' + Math.floor(40 + pulse * 120) + ',200,90)' : '#2a1b0e');
    cx.fillStyle = '#fff'; cx.font = 'bold 10px sans-serif'; cx.textAlign = 'center'; cx.fillText('DEN', den.x, den.y + den.r + 12);
    walls.forEach(function (w) {
      cx.fillStyle = 'rgba(0,0,0,.2)'; cx.fillRect(w.x + 3, w.y + 4, w.w, w.h);
      cx.fillStyle = '#8b5a2b'; cx.fillRect(w.x, w.y, w.w, w.h);
      cx.fillStyle = '#b57a3e'; cx.fillRect(w.x, w.y, w.w, 4);
      cx.fillStyle = '#5b3a1b'; if (w.w > w.h) for (var x = w.x + 12; x < w.x + w.w - 4; x += 16) cx.fillRect(x, w.y, 2, w.h); else for (var yy = w.y + 12; yy < w.y + w.h - 4; yy += 16) cx.fillRect(w.x, yy, w.w, 2);
    });
    eggs.forEach(function (e) {
      ell(e.x + 2, e.y + 6, 8, 3, 'rgba(0,0,0,.25)');
      if (e.gold) { ell(e.x, e.y, 13 + Math.sin(t * 6) * 2, 13 + Math.sin(t * 6) * 2, 'rgba(255,220,80,.35)'); ell(e.x, e.y, 8, 10, '#ffd23f'); ell(e.x - 2, e.y - 3, 2.5, 3.5, '#fff6b0'); }
      else { ell(e.x, e.y, 7, 9, '#fffaf0'); ell(e.x - 2, e.y - 3, 2, 3, '#fff'); }
    });
    farmers.forEach(drawFarmer); dogs.forEach(drawDog);
    if (st !== 'caught' || Math.floor(t * 10) % 2) drawFox();
    bushes.forEach(function (b) {
      ell(b.x + 2, b.y + 4, b.r, b.r * .8, 'rgba(0,0,0,.2)'); ell(b.x, b.y, b.r, b.r, '#2e7d32'); ell(b.x - b.r * .3, b.y - b.r * .3, b.r * .6, b.r * .6, '#3d9442');
      ell(b.x + b.r * .35, b.y + b.r * .2, b.r * .35, b.r * .35, '#256628');
    });
    cx.restore();

    cx.setTransform(D, 0, 0, D, 0, 0);
    cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillRect(0, 0, W, TOP);
    var fs = clamp(W * .035, 12, 16); cx.font = 'bold ' + fs + 'px "Trebuchet MS",sans-serif'; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillStyle = '#fff';
    ell(16, TOP / 2, 6, 8, '#fffaf0'); cx.fillStyle = '#fff'; cx.fillText(got + '/' + total, 28, TOP / 2);
    cx.fillText('♥ ' + Math.max(0, lives), 82, TOP / 2); cx.fillText('Lv ' + (level + 1), 128, TOP / 2);
    cx.textAlign = 'center'; cx.fillText('Score ' + score, W * .5 + 4, TOP / 2 - 9);
    var bw = Math.min(140, W * .3), bx = W / 2 - bw / 2 + 4, by = TOP / 2 + 4;
    cx.fillStyle = 'rgba(255,255,255,.25)'; cx.fillRect(bx, by, bw, 8); cx.fillStyle = alertV > .6 ? '#ff3030' : alertV > .3 ? '#ffb300' : '#7ed957'; cx.fillRect(bx, by, bw * alertV, 8);
    if (msgT > 0 && msg) { cx.font = 'bold ' + clamp(W * .045, 15, 24) + 'px "Trebuchet MS",sans-serif'; cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,.6)'; cx.strokeText(msg, W / 2, offY + 40); cx.fillStyle = '#fff'; cx.fillText(msg, W / 2, offY + 40); }
    if (joy) {
      var dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.min(40, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
      cx.strokeStyle = 'rgba(255,255,255,.5)'; cx.lineWidth = 3; cx.beginPath(); cx.arc(joy.ox, joy.oy, 40, 0, 7); cx.stroke();
      cx.fillStyle = 'rgba(255,255,255,.45)'; cx.beginPath(); cx.arc(joy.ox + Math.cos(a) * m, joy.oy + Math.sin(a) * m, 18, 0, 7); cx.fill();
    }
  }

  var last = 0, acc = 0;
  function loop(ts) {
    var dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts; acc += dt;
    while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
    draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= CONTROLS ================= */
  function newGame() { actx(); score = 0; lives = 3; level = 0; $('ov').style.display = 'none'; genLevel(0); }
  var KM = { ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0], ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1] };
  var held = {};
  function kcalc() { var x = 0, y = 0; for (var k in held) { x += held[k][0]; y += held[k][1]; } keys.x = clamp(x, -1, 1); keys.y = clamp(y, -1, 1); }
  document.addEventListener('keydown', function (e) {
    if (KM[e.key]) { held[e.key] = KM[e.key]; kcalc(); e.preventDefault(); }
    if (e.key === 'Enter' && $('ov').style.display !== 'none') newGame();
  });
  document.addEventListener('keyup', function (e) { if (KM[e.key]) { delete held[e.key]; kcalc(); } });
  window.addEventListener('blur', function () { held = {}; kcalc(); joy = null; });
  cv.addEventListener('pointerdown', function (e) { joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
  cv.addEventListener('pointermove', function (e) { if (joy && joy.id === e.pointerId) { joy.x = e.clientX; joy.y = e.clientY; } });
  function pend(e) { if (joy && joy.id === e.pointerId) joy = null; }
  cv.addEventListener('pointerup', pend); cv.addEventListener('pointercancel', pend);
  $('go').onclick = newGame;
  $('mute').onclick = function () { muted = !muted; this.textContent = muted ? '🔕' : '🔔'; };
  $('mus').onclick = function () { musicOn = !musicOn; this.style.opacity = musicOn ? 1 : .45; music(st === 'play'); };
  if (best) $('stats').innerHTML = '🏅 Best: ' + best;
  genLevel(0); st = 'title';
})();
