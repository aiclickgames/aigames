<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Count War - Counting Game for Kids</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#2b1b6b,#0f3d6e 60%,#0b6b6b);overflow-x:hidden;user-select:none}
#app{max-width:900px;margin:0 auto;min-height:100%;padding:12px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1{font-size:clamp(2.2rem,9vw,4rem);margin:10px 0 4px;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.sub{text-align:center;font-size:1.1rem;opacity:.9;margin:0 0 18px}
.center{margin:auto;text-align:center;width:100%}
.btn{border:0;border-radius:18px;font:inherit;font-weight:800;font-size:1.3rem;padding:14px 26px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.lv{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:10px}
.lv .btn{width:min(320px,90%)}
.easy{background:#2eb872}.med{background:#f5a623}.hard{background:#e8505b}
.hud{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.hud .sp{flex:1}
.pill{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:999px}
.ic{border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.2rem;border-radius:50%;width:42px;height:42px;cursor:pointer}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.15);margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffd24a;transition:width .3s}
#q{text-align:center;font-size:clamp(1.2rem,4.5vw,1.8rem);font-weight:800;margin:6px 0 12px;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:10px}
.field{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;flex:1;min-height:200px;max-height:360px}
.vs{align-self:center;font-size:2rem}
.army{position:relative;border-radius:20px;padding:34px 8px 8px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;border:4px solid transparent;transition:transform .15s}
.army.red{background:rgba(232,80,91,.35)}
.army.blue{background:rgba(70,140,255,.35)}
.army .tag{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:800;font-size:.95rem}
.army .n{position:absolute;top:2px;right:8px;background:#fff;color:#222;border-radius:999px;font-weight:900;padding:0 12px;font-size:1.3rem;display:none}
.army.show .n{display:block}
.army span.u{display:inline-block;line-height:1;animation:pop .3s backwards}
.army.tap{cursor:pointer}
.army.tap:hover{transform:scale(1.03);border-color:#fff}
.army.win{border-color:#ffd24a;box-shadow:0 0 30px #ffd24a;transform:scale(1.04)}
@keyframes pop{from{transform:scale(0)}}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.choices .btn{background:#6c5ce7;font-size:1.8rem;padding:14px 0}
.choices .btn.ok{background:#2eb872}
.choices .btn.no{background:#e8505b}
#fb{text-align:center;font-weight:800;font-size:1.3rem;min-height:2em;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{font-size:4rem;margin:6px 0}
.sc{font-size:1.4rem;margin:6px 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row .btn{background:#6c5ce7}
.fx{position:fixed;font-size:2rem;pointer-events:none;animation:fly 1s forwards;z-index:9}
@keyframes fly{to{transform:translateY(-140px) rotate(40deg);opacity:0}}
@media (max-width:560px){.choices{grid-template-columns:repeat(2,1fr)}.field{max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="start">
    <div class="center">
      <div class="big">🦊⚔️🐸</div>
      <h1>Count War</h1>
      <p class="sub">Count the armies and win every battle!</p>
      <div class="lv">
        <button class="btn easy" data-l="easy">🌱 Easy<br><small>numbers 1 to 5</small></button>
        <button class="btn med" data-l="med">⭐ Medium<br><small>numbers up to 10</small></button>
        <button class="btn hard" data-l="hard">🔥 Hard<br><small>numbers up to 20</small></button>
      </div>
      <p class="sub" id="best" style="margin-top:18px"></p>
    </div>
  </section>

  <section class="screen" id="game">
    <div class="hud">
      <button class="ic" id="home" aria-label="Home">🏠</button>
      <span class="pill" id="rd">Battle 1/10</span>
      <span class="pill" id="sc">⭐ 0</span>
      <span class="sp"></span>
      <button class="ic" id="say" aria-label="Read aloud">🔊</button>
      <button class="ic" id="mute" aria-label="Sound">🔔</button>
    </div>
    <div class="bar"><i id="pg"></i></div>
    <div id="q"></div>
    <div class="field">
      <div class="army red" id="aR"></div>
      <div class="vs">⚔️</div>
      <div class="army blue" id="aB"></div>
    </div>
    <div class="choices" id="ch"></div>
    <div id="fb"></div>
  </section>

  <section class="screen" id="end">
    <div class="center">
      <div class="big" id="stars"></div>
      <h1 id="etitle">Great job!</h1>
      <div class="sc" id="escore"></div>
      <div class="sc" id="ebest"></div>
      <div class="row">
        <button class="btn" id="again">▶ Play again</button>
        <button class="btn" id="menu">🏠 Menu</button>
      </div>
    </div>
  </section>

</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var LV = { easy: [1, 5], med: [2, 10], hard: [3, 20] };
  var NAMES = { easy: 'Easy', med: 'Medium', hard: 'Hard' };
  var FOX = '🦊', FROG = '🐸', ROUNDS = 10;
  var st = { gen: 0, lv: 'easy', round: 0, score: 0, ok: 0, streak: 0, busy: false, cur: null };
  var muted = false, ac = null;

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sv(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function show(id) { ['start', 'game', 'end'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }

  /* ---- sound ---- */
  function beep(f, d, type) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.15, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  function good() { beep(523, .12); setTimeout(function () { beep(784, .2); }, 110); }
  function bad() { beep(180, .35, 'sawtooth'); }
  function speak(t) {
    if (muted || !window.speechSynthesis) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
  }

  /* ---- armies ---- */
  function fill(div, n, emoji, label) {
    div.innerHTML = '';
    div.classList.remove('win', 'show', 'tap');
    var tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = label; div.appendChild(tag);
    var num = document.createElement('div'); num.className = 'n'; num.textContent = n; div.appendChild(num);
    var size = n <= 6 ? 3 : n <= 12 ? 2.3 : 1.8;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span'); s.className = 'u'; s.textContent = emoji;
      s.style.fontSize = size + 'rem'; s.style.animationDelay = (i * 30) + 'ms';
      div.appendChild(s);
    }
  }

  /* ---- questions ---- */
  function makeQ() {
    var r = LV[st.lv], types = ['bigger', 'count', 'count'];
    if (st.lv !== 'easy') types.push('total');
    if (st.lv === 'hard') types.push('more');
    var t = types[rnd(0, types.length - 1)];
    var a = rnd(r[0], r[1]), b = rnd(r[0], r[1]);
    if (t === 'more' || t === 'bigger') { while (a === b) b = rnd(r[0], r[1]); }
    var q = { t: t, a: a, b: b };
    if (t === 'bigger') { q.text = 'Which army is BIGGER?'; q.ans = a > b ? 'R' : 'B'; }
    else if (t === 'count') { q.side = rnd(0, 1) ? 'R' : 'B'; q.text = 'How many ' + (q.side === 'R' ? FOX + ' foxes' : FROG + ' frogs') + '?'; q.ans = q.side === 'R' ? a : b; }
    else if (t === 'total') { q.text = 'How many animals in BOTH armies?'; q.ans = a + b; }
    else { q.text = 'How many MORE in the bigger army?'; q.ans = Math.abs(a - b); }
    return q;
  }
  function options(ans) {
    var set = [ans], tries = 0;
    while (set.length < 4 && tries++ < 50) {
      var v = ans + rnd(-3, 3);
      if (v >= 0 && set.indexOf(v) < 0) set.push(v);
    }
    var k = ans + 4; while (set.length < 4) set.push(k++);
    return shuffle(set);
  }

  function next() {
    if (st.round >= ROUNDS) { finish(); return; }
    st.round++; st.busy = false;
    var q = st.cur = makeQ();
    $('rd').textContent = 'Battle ' + st.round + '/' + ROUNDS;
    $('sc').textContent = '⭐ ' + st.score;
    $('pg').style.width = ((st.round - 1) / ROUNDS * 100) + '%';
    $('q').textContent = q.text; $('fb').textContent = '';
    fill($('aR'), q.a, FOX, '🔴 Red Army'); fill($('aB'), q.b, FROG, '🔵 Blue Army');
    var ch = $('ch'); ch.innerHTML = '';
    if (q.t === 'bigger') {
      ch.style.display = 'none';
      [['aR', 'R'], ['aB', 'B']].forEach(function (x) {
        var d = $(x[0]); d.classList.add('tap'); d.onclick = function () { answer(x[1] === q.ans, d); };
      });
    } else {
      ch.style.display = 'grid';
      $('aR').onclick = $('aB').onclick = null;
      options(q.ans).forEach(function (v) {
        var b = document.createElement('button'); b.className = 'btn'; b.textContent = v;
        b.onclick = function () { answer(v === q.ans, b); };
        ch.appendChild(b);
      });
    }
    setTimeout(function () { speak(q.text); }, 300);
  }

  function fx(e) {
    var n = ['🎉', '⭐', '✨', '🎊'];
    for (var i = 0; i < 6; i++) {
      var s = document.createElement('div'); s.className = 'fx'; s.textContent = n[i % 4];
      s.style.left = (30 + Math.random() * 40) + '%'; s.style.top = (40 + Math.random() * 20) + '%';
      document.body.appendChild(s); setTimeout(function (x) { return function () { x.remove(); }; }(s), 1000);
    }
  }

  function answer(ok, node) {
    if (st.busy) return; st.busy = true;
    var q = st.cur;
    $('aR').classList.add('show'); $('aB').classList.add('show');
    var btns = $('ch').children;
    for (var i = 0; i < btns.length; i++) if (+btns[i].textContent === q.ans) btns[i].classList.add('ok');
    if (q.t === 'bigger') $(q.ans === 'R' ? 'aR' : 'aB').classList.add('win');
    if (ok) {
      st.ok++; st.streak++; st.score += 10 + (st.streak >= 3 ? 5 : 0);
      $('fb').textContent = st.streak >= 3 ? '🔥 ' + st.streak + ' in a row!' : '🎉 Correct!';
      good(); fx(); speak('Correct!');
    } else {
      st.streak = 0; node.classList.add('no'); node.classList.add('shake');
      $('fb').textContent = q.t === 'bigger' ? '❌ The bigger army is glowing!' : '❌ The answer is ' + q.ans;
      bad();
    }
    $('sc').textContent = '⭐ ' + st.score;
    var g = st.gen; setTimeout(function () { if (g === st.gen) next(); }, ok ? 1500 : 2300);
  }

  function finish() {
    var s = st.ok >= 9 ? 3 : st.ok >= 6 ? 2 : 1;
    $('stars').textContent = '⭐⭐⭐'.slice(0, s) + '☆☆☆'.slice(0, 3 - s);
    $('etitle').textContent = s === 3 ? 'You won the war! 🏆' : s === 2 ? 'Great job! 👏' : 'Keep practicing! 💪';
    $('escore').textContent = st.ok + ' of ' + ROUNDS + ' correct · ' + st.score + ' points';
    var key = 'cw_best_' + st.lv, best = +ls(key) || 0;
    if (st.score > best) { best = st.score; sv(key, best); }
    $('ebest').textContent = '🏅 Best (' + NAMES[st.lv] + '): ' + best;
    show('end');
    if (s === 3) { good(); fx(); }
  }

  function start(l) {
    st.gen++; st.lv = l; st.round = 0; st.score = 0; st.ok = 0; st.streak = 0;
    show('game'); next();
  }
  function bestText() {
    var t = [];
    ['easy', 'med', 'hard'].forEach(function (k) { var b = ls('cw_best_' + k); if (b) t.push(NAMES[k] + ': ' + b); });
    $('best').textContent = t.length ? '🏅 Best scores: ' + t.join(' · ') : '';
  }

  var bs = document.querySelectorAll('[data-l]');
  for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { start(this.getAttribute('data-l')); };
  $('home').onclick = $('menu').onclick = function () { st.gen++; st.busy = true; bestText(); show('start'); };
  $('again').onclick = function () { start(st.lv); };
  $('say').onclick = function () { if (st.cur) speak(st.cur.text); };
  $('mute').onclick = function () { muted = !muted; $('mute').textContent = muted ? '🔕' : '🔔'; if (muted && window.speechSynthesis) speechSynthesis.cancel(); };
  bestText();
})();
</script>
</body>
</html>
