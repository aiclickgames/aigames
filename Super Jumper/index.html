<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Jumper - Platform Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5c94fc;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,60,.6);padding:12px;overflow:auto;z-index:8}
.card{text-align:center;max-width:400px;width:100%}
h1{margin:0 0 6px;font-size:clamp(2rem,9vw,3.2rem);text-shadow:0 4px 0 rgba(0,0,0,.35)}
#msg{margin:0 0 8px;font-size:1.1rem}
#stats{font-size:1.15rem;font-weight:800;line-height:1.7;margin-bottom:8px}
#go{border:0;border-radius:18px;font:inherit;font-weight:800;font-size:1.5rem;padding:14px 44px;color:#fff;background:#2eb872;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}.chip{border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer}.chip.on{background:#2eb872;border-color:#fff}
.lvgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 12px}.lv{border:0;border-radius:8px;background:#2eb872;color:#fff;font:inherit;font-weight:800;font-size:.8rem;padding:8px 0;cursor:pointer}.lv.lock{background:rgba(255,255,255,.18);color:rgba(255,255,255,.5);cursor:default}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.how{margin:14px 0 0;font-size:.92rem;line-height:1.6;opacity:.92}
.sb{position:fixed;top:34px;border:0;border-radius:50%;width:38px;height:38px;font-size:1.05rem;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;z-index:5}
#mute{right:8px}#mus{right:52px}
#tc{display:none}
.pad{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:14px;z-index:6}
.pad.l{left:14px}.pad.r{right:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-weight:800;font-size:1.5rem;touch-action:none}
.pad button.on{background:rgba(255,255,255,.35)}
.pad.r button#bj{width:84px;height:84px;background:rgba(46,184,114,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="sb" id="mus" aria-label="Music">🎵</button>
<button class="sb" id="mute" aria-label="Sound effects">🔔</button>
<div id="tc">
  <div class="pad l"><button id="bl">◀</button><button id="br">▶</button></div>
  <div class="pad r"><button id="bb">B</button><button id="bj">A</button></div>
</div>
<div id="ov">
  <div class="card">
    <h1>⭐ Super Jumper</h1>
    <p id="msg">Jump, stomp enemies and reach the flag!</p>
    <div id="stats"></div>
    <div class="how">Difficulty</div><div id="diff" class="chips"></div>
    <div class="how">Choose a level (unlock more by winning)</div><div id="lvls" class="lvgrid"></div>
    <button id="go">▶ Start Game</button>
    <p class="how">Move: ← → or A D · Jump: Space / ↑ / W · Run: hold Shift or Z<br>Phone: use the on-screen buttons (A = jump, B = run)<br>Hit <b>?</b> blocks for coins and mushrooms. Stomp enemies from above!</p>
  </div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, D = 1, S = 1, offY = 0, visW = 300;
  var T = 16, ROWS = 15, LEVELS = 30;
  var G = [], LEN = 0, enemies = [], items = [], parts = [], pops = [], bumps = [];
  var state = 'title', level = 0, cam = 0, frame = 0, timer = 0, flagY = 0, clearT = 0;
  var score = 0, coins = 0, lives = 3, time = 300, best = +ls('sj_best') || 0;
  var K = { l: 0, r: 0, j: 0, b: 0 };
  var P = { x: 40, y: 0, w: 12, h: 15, vx: 0, vy: 0, big: 0, face: 1, ground: 0, inv: 0, coy: 0, lock: 0, anim: 0, slide: 0 };
  var ac = null, muted = false, musicOn = true, mt = null, mstep = 0;
  var THEME = [['#5c94fc', '#bfe3ff', '#6bbf6b', '#3f9a4a', 0], ['#7a4fc8', '#ffb07a', '#5a8a63', '#335f4a', 0], ['#0b1040', '#2c3a8a', '#244a55', '#17323f', 1], ['#f6c667', '#fff0c4', '#d9a24a', '#b9822e', 0], ['#9fd4ff', '#e8f6ff', '#cfe8f5', '#9fc3d8', 0]];
  var diff = (function () { var v = ls('sj_diff'); return v === null ? 1 : Math.min(2, Math.max(0, +v)); })();
  var DN = ['Easy', 'Normal', 'Hard'], LIVES = [5, 3, 2], TIMES = [400, 300, 240];
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function wi() { return Math.floor(level / 6) % THEME.length; }
  function wl() { return (Math.floor(level / 6) + 1) + '-' + (level % 6 + 1); }
  var STARS = []; for (var q = 0; q < 50; q++) STARS.push([Math.random(), Math.random() * .55, Math.random() * 1.2 + .4]);

  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sv(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function resize() {
    D = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * D; cv.height = H * D; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    S = Math.min(H / (ROWS * T), W / 256); if (S < .5) S = .5;
    visW = W / S; offY = Math.max(0, (H - ROWS * T * S) * .35);
  }
  window.addEventListener('resize', resize); resize();

  /* ================= SOUND ================= */
  function actx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, d, type, vol, f2, delay) {
    if (muted || !actx()) return;
    var o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + (delay || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f, s);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(vol || .08, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d + .02);
  }
  function noise(d, vol) {
    if (muted || !actx()) return;
    var n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
    for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = vol || .3;
    s.connect(g); g.connect(ac.destination); s.start();
  }
  function seq(a, d, type, vol, gap) { a.forEach(function (f, i) { tone(f, d, type, vol, 0, i * gap); }); }
  var sfx = {
    jump: function (b) { tone(b ? 240 : 330, .16, 'square', .07, b ? 500 : 700); },
    coin: function () { tone(988, .07, 'square', .06); tone(1319, .25, 'square', .06, 0, .07); },
    stomp: function () { tone(220, .12, 'square', .09, 60); noise(.06, .15); },
    bump: function () { tone(120, .1, 'square', .1, 70); },
    brick: function () { noise(.28, .35); tone(160, .15, 'sawtooth', .06, 50); },
    item: function () { seq([392, 523, 659, 784], .1, 'square', .06, .06); },
    power: function () { seq([523, 659, 784, 1047, 1319, 1568], .1, 'square', .06, .06); },
    down: function () { seq([784, 659, 523, 392, 262], .11, 'sawtooth', .06, .08); },
    die: function () { seq([784, 698, 659, 587, 523, 392, 330, 262], .13, 'square', .06, .12); },
    flag: function () { tone(1300, 1.1, 'triangle', .12, 180); },
    win: function () { seq([523, 659, 784, 1047, 784, 1047, 1319, 1568], .16, 'square', .06, .13); },
    life: function () { seq([659, 784, 1319, 1047, 1175, 1568], .09, 'square', .06, .08); },
    over: function () { seq([392, 330, 262, 196], .3, 'sawtooth', .07, .3); },
    tick: function () { tone(1500, .03, 'square', .04); }
  };
  var MEL = [
    [0, 4, 7, 12, 7, 4, 0, null, 2, 5, 9, 14, 9, 5, 2, null, 4, 7, 11, 16, 11, 7, 4, null, 0, 4, 7, 12, 16, 12, 7, 4],
    [0, 3, 7, 12, 7, 3, 0, null, -2, 2, 5, 10, 5, 2, -2, null, 3, 7, 10, 15, 10, 7, 3, null, 0, 3, 7, 10, 12, 10, 7, 3],
    [0, 2, 5, 9, 12, 9, 5, 2, 3, 5, 8, 12, 15, 12, 8, 5, 5, 7, 10, 14, 17, 14, 10, 7, 2, 5, 9, 12, 14, 12, 9, 5]
  ];
  var BASS = [[-12, -10, -8, -12], [-12, -14, -9, -12], [-12, -9, -7, -10]], TEMPO = [150, 165, 125];
  function music(on) {
    clearInterval(mt); mt = null;
    if (!on || !musicOn) return;
    mstep = 0;
    mt = setInterval(function () {
      if (muted || !ac || state !== 'play') return;
      var n = MEL[wi() % 3][mstep % 32];
      if (n !== null) tone(261.63 * Math.pow(2, n / 12), .14, 'square', .03);
      if (mstep % 8 === 0) tone(261.63 * Math.pow(2, BASS[wi() % 3][(mstep >> 3) % 4] / 12), .7, 'triangle', .08);
      if (mstep % 2 === 1) noise(.02, .03);
      mstep++;
    }, TEMPO[wi() % 3]);
  }

  /* ================= LEVEL GENERATION ================= */
  function rngf(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gen(n) {
    var rng = rngf(777 + n * 131), r, c, i, j, dd = clamp(n / 12 + [-.8, 0, .9][diff], 0, 3.2);
    LEN = 130 + (n % 6) * 25 + Math.min(4, Math.floor(n / 6)) * 12; G = []; enemies = [];
    for (r = 0; r < ROWS; r++) { G[r] = []; for (c = 0; c < LEN; c++) G[r][c] = (r >= 13) ? '#' : '.'; }
    'B?M?B'.split('').forEach(function (ch, k) { G[9][14 + k] = ch; });
    for (i = 0; i < 4; i++) G[6][15 + i] = 'c';
    var x = 24;
    while (x < LEN - 30) {
      var p = rng();
      if (p < .17 + .04 * dd) {
        var w = 2 + (rng() < .35 + .15 * dd ? 1 : 0);
        for (i = 0; i < w; i++) G[13][x + i] = G[14][x + i] = '.';
        for (i = 0; i < w + 2; i++) G[9][x - 1 + i] = (i === 1 && rng() < .5) ? 'c' : G[9][x - 1 + i];
        x += w + 2;
      } else if (p < .34) {
        var h = 2 + Math.floor(rng() * 2);
        for (j = 0; j < h; j++) { G[12 - j][x] = 'P'; G[12 - j][x + 1] = 'P'; }
        x += 4;
      } else if (p < .5) {
        var s = 3 + (dd > .8 ? 1 : 0);
        for (i = 0; i < s; i++) for (j = 0; j <= i; j++) G[12 - j][x + i] = 'X';
        x += s + 2;
      } else if (p < .68) {
        var pw = 3 + Math.floor(rng() * 4);
        for (i = 0; i < pw; i++) G[9][x + i] = rng() < .4 ? '?' : 'B';
        if (rng() < .45) G[9][x + Math.floor(pw / 2)] = 'M';
        if (rng() < .5) for (i = 0; i < pw; i++) G[6][x + i] = 'c';
        x += pw + 1;
      } else if (p < .88) {
        var k = 1 + Math.floor(rng() * (2 + dd));
        for (i = 0; i < k; i++) { var ec = x + i * 3; if (G[13][ec] === '#' && G[12][ec] === '.') enemies.push({ c: ec, t: (dd > .5 && rng() < Math.min(.6, .2 + dd * .1)) ? 'u' : 'e' }); }
        x += k * 3 + 1;
      } else {
        for (i = 0; i < 5; i++) G[10 - (i === 2 ? 1 : 0)][x + i] = 'c';
        x += 6;
      }
      x += 2 + Math.floor(rng() * 3);
    }
    var fc = LEN - 12;
    G[12][fc] = 'X';
    for (r = 3; r <= 11; r++) G[r][fc] = 'F';
    return fc;
  }
  var FC = 0;

  function loadLevel(n, keepBig) {
    level = n; FC = gen(n);
    enemies = enemies.map(function (e) { return { x: e.c * T + 2, y: 12 * T - 2, w: 12, h: 12, vx: -(e.t === 'u' ? .35 : .5), vy: 0, dir: -1, t: e.t, act: 0, ground: 0, hw: 0 }; });
    items = []; parts = []; pops = []; bumps = [];
    P.x = 40; P.y = 12 * T - 15; P.vx = 0; P.vy = 0; P.h = 15; P.big = 0; P.inv = 0; P.slide = 0; P.face = 1; P.hide = 0;
    if (keepBig) { P.big = 1; P.h = 30; P.y -= 15; }
    cam = 0; time = TIMES[diff]; frame = 0; flagY = 3 * T; timer = 90; state = 'intro';
  }

  /* ================= PHYSICS ================= */
  function solid(c, r) {
    if (c < 0 || c >= LEN) return true;
    if (r < 0 || r >= ROWS) return false;
    return '#BXMP?m'.indexOf(G[r][c]) >= 0;
  }
  function move(b, pl) {
    b.hw = 0; b.x += b.vx;
    var r0 = Math.floor(b.y / T), r1 = Math.floor((b.y + b.h - .01) / T), c, r;
    if (b.vx !== 0) {
      var cc = b.vx > 0 ? Math.floor((b.x + b.w - .01) / T) : Math.floor(b.x / T);
      for (r = r0; r <= r1; r++) if (solid(cc, r)) { b.x = b.vx > 0 ? cc * T - b.w : (cc + 1) * T; b.hw = 1; b.vx = 0; break; }
    }
    b.ground = 0; b.y += b.vy;
    var c0 = Math.floor(b.x / T), c1 = Math.floor((b.x + b.w - .01) / T);
    if (b.vy > 0) {
      var rb = Math.floor((b.y + b.h - .01) / T);
      for (c = c0; c <= c1; c++) if (solid(c, rb)) { b.y = rb * T - b.h; b.vy = 0; b.ground = 1; break; }
    } else if (b.vy < 0) {
      var rt = Math.floor(b.y / T), best = -1;
      for (c = c0; c <= c1; c++) if (solid(c, rt)) { if (best < 0 || Math.abs(c * T + 8 - (b.x + b.w / 2)) < Math.abs(best * T + 8 - (b.x + b.w / 2))) best = c; }
      if (best >= 0) { b.y = (rt + 1) * T; b.vy = 0; if (pl) bump(best, rt); }
    }
  }
  function pop(x, y, txt) { pops.push({ x: x, y: y, t: 0, s: txt }); }
  function addScore(n, x, y) { score += n; if (x != null) pop(x, y, String(n)); }
  function addCoin() { coins++; if (coins >= 100) { coins -= 100; lives++; sfx.life(); } }

  function bump(c, r) {
    var ch = G[r][c];
    if (ch === '?') { G[r][c] = 'm'; bumps.push({ c: c, r: r, t: 0 }); parts.push({ coin: 1, x: c * T + 4, y: r * T - 4, vy: -5, t: 0 }); addCoin(); addScore(200, c * T, r * T - 14); sfx.coin(); }
    else if (ch === 'M') { G[r][c] = 'm'; bumps.push({ c: c, r: r, t: 0 }); items.push({ x: c * T + 2, y: r * T, w: 12, h: 12, vx: 0, vy: 0, dir: 1, em: 16, ty: r * T - 12, ground: 0 }); sfx.item(); }
    else if (ch === 'B') {
      if (P.big) { G[r][c] = '.'; for (var i = 0; i < 4; i++) parts.push({ x: c * T + (i % 2) * 8, y: r * T + (i >> 1) * 8, vx: (i % 2 ? 1.4 : -1.4), vy: -4 - (i >> 1) * 1.5, t: 0 }); addScore(50); sfx.brick(); }
      else { bumps.push({ c: c, r: r, t: 0 }); sfx.bump(); }
    } else sfx.bump();
    enemies.forEach(function (e) {
      if (!e.fl && !e.sq && e.ground && Math.abs(e.y + e.h - r * T) < 3 && e.x + e.w > c * T && e.x < (c + 1) * T) { e.fl = 1; e.vy = -4; e.vx = P.x < e.x ? 1 : -1; addScore(100, e.x, e.y - 10); sfx.stomp(); }
    });
  }

  /* ================= GAME LOGIC ================= */
  function hurt() {
    if (P.inv > 0 || state !== 'play') return;
    if (P.big) { P.big = 0; P.y += 15; P.h = 15; P.inv = 100; sfx.down(); }
    else die();
  }
  function die() {
    if (state !== 'play') return;
    state = 'dead'; timer = 0; P.vy = -7; P.vx = 0; music(false); sfx.die();
  }
  function startWin() {
    state = 'win'; P.vx = 0; P.vy = 0; P.slide = 1; music(false); sfx.flag();
    addScore(1000, P.x, P.y - 10);
  }

  function stepPlayer() {
    var p = P, run = K.b, max = run ? 2.3 : 1.5, a = p.ground ? .14 : .1;
    if (K.l && !K.r) { p.vx -= a; p.face = -1; }
    else if (K.r && !K.l) { p.vx += a; p.face = 1; }
    else { p.vx *= p.ground ? .84 : .97; if (Math.abs(p.vx) < .04) p.vx = 0; }
    if (p.vx > max) p.vx = Math.max(max, p.vx - .05); if (p.vx < -max) p.vx = Math.min(-max, p.vx + .05);
    if (p.ground) p.coy = 6; else if (p.coy > 0) p.coy--;
    if (K.j) { if (!p.lock && p.coy > 0) { p.vy = -(6.9 + Math.abs(p.vx) * .35); p.coy = 0; p.lock = 1; p.ground = 0; sfx.jump(p.big); } } else p.lock = 0;
    p.vy += (p.vy < 0 && K.j) ? .34 : .78; if (p.vy > 8) p.vy = 8;
    move(p, true);
    if (p.x < cam) { p.x = cam; if (p.vx < 0) p.vx = 0; }
    p.anim += Math.abs(p.vx) * .12;
    if (p.inv > 0) p.inv--;
    if (p.y > ROWS * T + 20) { die(); return; }
    var c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T), r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T), c, r;
    for (r = r0; r <= r1; r++) for (c = c0; c <= c1; c++) {
      if (r < 0 || r >= ROWS) continue;
      var ch = G[r][c];
      if (ch === 'c') { G[r][c] = '.'; addCoin(); addScore(100); sfx.coin(); }
      else if (ch === 'F') { startWin(); return; }
    }
  }

  function stepEnemies() {
    enemies.forEach(function (e) {
      if (e.rm) return;
      if (e.fl) { e.vy += .5; e.y += e.vy; e.x += e.vx; if (e.y > ROWS * T + 40) e.rm = 1; return; }
      if (e.sq) { if (--e.sq <= 0) e.rm = 1; return; }
      if (!e.act) { if (e.x < cam + visW + 24) e.act = 1; else return; }
      e.vx = e.dir * (e.t === 'u' ? .35 : .5); e.vy += .5; if (e.vy > 7) e.vy = 7;
      move(e); if (e.hw) e.dir *= -1;
      if (e.y > ROWS * T + 40) { e.rm = 1; return; }
      if (state !== 'play') return;
      if (P.x < e.x + e.w && P.x + P.w > e.x && P.y < e.y + e.h && P.y + P.h > e.y) {
        if (e.t === 'e' && P.vy > 0 && (P.y + P.h - e.y) < 11) {
          e.sq = 24; P.vy = K.j ? -7 : -4.5; addScore(100, e.x, e.y - 10); sfx.stomp();
        } else hurt();
      }
    });
    enemies = enemies.filter(function (e) { return !e.rm; });
  }

  function stepItems() {
    items.forEach(function (m) {
      if (m.em > 0) { m.em--; m.y -= 12 / 16; if (m.em === 0) m.y = m.ty; return; }
      m.vx = m.dir * .9; m.vy += .5; if (m.vy > 7) m.vy = 7;
      move(m); if (m.hw) m.dir *= -1;
      if (m.y > ROWS * T + 30) m.rm = 1;
      if (state === 'play' && P.x < m.x + m.w && P.x + P.w > m.x && P.y < m.y + m.h && P.y + P.h > m.y) {
        m.rm = 1;
        if (!P.big) { P.big = 1; P.y -= 15; P.h = 30; sfx.power(); } else sfx.item();
        addScore(1000, m.x, m.y - 10);
      }
    });
    items = items.filter(function (m) { return !m.rm; });
    parts.forEach(function (p) { p.t++; if (p.coin) { p.vy += .4; p.y += p.vy; if (p.t > 22) p.rm = 1; } else { p.vy += .4; p.y += p.vy; p.x += p.vx; if (p.y > ROWS * T + 20) p.rm = 1; } });
    parts = parts.filter(function (p) { return !p.rm; });
    bumps.forEach(function (b) { b.t++; }); bumps = bumps.filter(function (b) { return b.t < 10; });
    pops.forEach(function (p) { p.t++; p.y -= .5; }); pops = pops.filter(function (p) { return p.t < 50; });
  }

  function endLevelOrGame() {
    var pg = +ls('sj_prog') || 0; if (Math.min(LEVELS - 1, level + 1) > pg) sv('sj_prog', Math.min(LEVELS - 1, level + 1));
    if (level + 1 < LEVELS) { loadLevel(level + 1, P.big); }
    else {
      state = 'done'; var nb = score > best; if (nb) { best = score; sv('sj_best', best); }
      $('msg').textContent = '🏆 You finished all 30 levels!';
      $('stats').innerHTML = 'Final score: ' + score + '<br>🏅 Best: ' + best;
      $('go').textContent = '↻ Play again'; buildMenu(); $('ov').style.display = 'flex';
    }
  }

  function step() {
    var i;
    if (state === 'intro') { if (--timer <= 0) { state = 'play'; music(true); } return; }
    if (state === 'play') {
      frame++; if (frame % 60 === 0) { time--; if (time <= 0) { die(); return; } }
      stepPlayer(); if (state !== 'play') return;
      stepEnemies(); stepItems();
      var tg = P.x - visW * .4; if (tg > cam) cam = tg;
      cam = Math.max(0, Math.min(cam, LEN * T - visW));
    } else if (state === 'dead') {
      timer++; if (timer > 20) { P.vy += .5; P.y += P.vy; }
      stepItems(); stepEnemies();
      if (timer > 150) {
        lives--;
        if (lives < 0) {
          state = 'over'; sfx.over(); var nb = score > best; if (nb) { best = score; sv('sj_best', best); }
          $('msg').textContent = 'Game Over'; $('stats').innerHTML = 'Score: ' + score + '<br>🏅 Best: ' + best;
          $('go').textContent = '↻ Try again'; buildMenu(); setTimeout(function () { if (state === 'over') $('ov').style.display = 'flex'; }, 900);
        } else loadLevel(level, false);
      }
    } else if (state === 'win') {
      stepItems();
      if (P.slide) {
        P.x = FC * T + 1; P.y += 2; flagY = Math.min(flagY + 2, 11 * T - 8);
        if (P.y + P.h >= 12 * T) { P.y = 12 * T - P.h; P.slide = 0; P.face = 1; }
      } else {
        P.vx = 1.1; P.vy += .78; move(P); P.anim += .15; flagY = Math.min(flagY + 2, 11 * T - 8);
        if (P.x > (LEN - 4) * T) { P.hide = 1; state = 'clear'; clearT = 0; sfx.win(); }
      }
    } else if (state === 'clear') {
      clearT++;
      if (time > 0) { var d = Math.min(time, 3); time -= d; score += d * 10; if (clearT % 3 === 0) sfx.tick(); }
      else if (clearT > 140) endLevelOrGame();
    }
  }

  /* ================= DRAWING ================= */
  function rect(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x, y, w, h); }
  function drawTile(ch, x, y, c, r) {
    var th = THEME[wi()];
    if (ch === '#') { rect(x, y, T, T, '#b5651d'); rect(x, y, T, 4, '#4caf50'); rect(x + 2, y + 8, 4, 2, '#8a4a12'); rect(x + 10, y + 11, 3, 2, '#8a4a12'); }
    else if (ch === 'B') { rect(x, y, T, T, '#c8582a'); cx.fillStyle = '#7a2e12'; cx.fillRect(x, y + 5, T, 1); cx.fillRect(x, y + 10, T, 1); cx.fillRect(x + 7, y, 1, 5); cx.fillRect(x + 3, y + 5, 1, 5); cx.fillRect(x + 11, y + 5, 1, 5); cx.fillRect(x + 7, y + 10, 1, 6); }
    else if (ch === '?' || ch === 'M') { rect(x, y, T, T, '#f5b301'); rect(x + 1, y + 1, T - 2, T - 2, '#ffd23f'); cx.fillStyle = '#8a5a00'; cx.font = 'bold 12px monospace'; cx.textAlign = 'center'; cx.fillText('?', x + 8, y + 13); }
    else if (ch === 'm') { rect(x, y, T, T, '#7b5a3a'); rect(x + 2, y + 2, T - 4, T - 4, '#9a7448'); }
    else if (ch === 'X') { rect(x, y, T, T, '#8d93a6'); rect(x + 1, y + 1, T - 2, T - 2, '#b4bacb'); rect(x + 4, y + 4, 8, 8, '#8d93a6'); }
    else if (ch === 'P') { var top = G[r - 1] && G[r - 1][c] !== 'P'; rect(x, y, T, T, '#2e9e3f'); rect(x + 2, y, 3, T, '#6fd47f'); rect(x + 12, y, 2, T, '#1f6e2b'); if (top) { rect(x - 1, y, T + 2, 5, '#3bbd4f'); rect(x - 1, y + 4, T + 2, 1, '#1f6e2b'); } }
    else if (ch === 'c') { var w = Math.abs(Math.sin(frame / 12 + c)) * 5 + 1; cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.ellipse(x + 8, y + 8, w, 6, 0, 0, 7); cx.fill(); cx.strokeStyle = '#b8860b'; cx.lineWidth = 1; cx.stroke(); }
    else if (ch === 'F') { rect(x + 7, y, 2, T, '#e0e0e0'); if (G[r - 1][c] !== 'F') { cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.arc(x + 8, y + 1, 3, 0, 7); cx.fill(); } }
  }
  function drawPlayer() {
    if (P.hide) return;
    if (P.inv > 0 && frame % 4 < 2 && state === 'play') return;
    var p = P, sc = p.h / 15, leg = Math.floor(p.anim) % 2, air = !p.ground;
    cx.save(); cx.translate(Math.floor(p.x), Math.floor(p.y));
    if (p.face < 0) { cx.translate(p.w, 0); cx.scale(-1, 1); }
    cx.scale(1, sc);
    rect(1, 0, 10, 3, '#14a3a3'); rect(6, 2, 6, 2, '#0e7a7a');
    rect(2, 3, 8, 4, '#ffcf9f'); rect(7, 4, 1, 2, '#222');
    rect(1, 7, 10, 4, '#ff7a2f'); rect(0, 8, 2, 3, '#ffcf9f'); rect(10, 8, 2, 3, '#ffcf9f');
    rect(2, 11, 8, 2, '#2d4fc0');
    if (air) { rect(0, 12, 4, 3, '#4a2a12'); rect(8, 12, 4, 3, '#4a2a12'); }
    else if (Math.abs(p.vx) > .1) { rect(leg ? 0 : 3, 13, 4, 2, '#4a2a12'); rect(leg ? 8 : 5, 13, 4, 2, '#4a2a12'); }
    else { rect(1, 13, 4, 2, '#4a2a12'); rect(7, 13, 4, 2, '#4a2a12'); }
    cx.restore();
  }
  function drawEnemy(e) {
    var x = Math.floor(e.x), y = Math.floor(e.y);
    cx.save();
    if (e.fl) { cx.translate(x + 6, y + 6); cx.scale(1, -1); cx.translate(-6, -6); x = 0; y = 0; }
    if (e.sq) { rect(x, y + 8, 12, 4, e.t === 'u' ? '#d63b3b' : '#8e44ad'); cx.restore(); return; }
    var f = Math.floor(frame / 8) % 2;
    if (e.t === 'u') {
      rect(x, y + 3, 12, 8, '#d63b3b'); rect(x + 1, y + 1, 10, 3, '#d63b3b');
      cx.fillStyle = '#fff'; for (var i = 0; i < 3; i++) { cx.beginPath(); cx.moveTo(x + 1 + i * 4, y + 2); cx.lineTo(x + 3 + i * 4, y - 3); cx.lineTo(x + 5 + i * 4, y + 2); cx.fill(); }
      rect(x + 3, y + 5, 2, 3, '#fff'); rect(x + 8, y + 5, 2, 3, '#fff'); rect(x + 4, y + 6, 1, 2, '#000'); rect(x + 9, y + 6, 1, 2, '#000');
      rect(f ? x : x + 2, y + 10, 4, 2, '#7a1b1b'); rect(f ? x + 8 : x + 6, y + 10, 4, 2, '#7a1b1b');
    } else {
      cx.fillStyle = '#8e44ad'; cx.beginPath(); cx.arc(x + 6, y + 6, 6, Math.PI, 0); cx.fill(); rect(x, y + 6, 12, 3, '#8e44ad');
      rect(x + 2, y + 4, 3, 3, '#fff'); rect(x + 7, y + 4, 3, 3, '#fff'); rect(x + 3, y + 5, 1, 2, '#000'); rect(x + 8, y + 5, 1, 2, '#000');
      rect(x + 2, y + 3, 4, 1, '#3b1a4a'); rect(x + 6, y + 3, 4, 1, '#3b1a4a');
      rect(f ? x : x + 2, y + 9, 4, 3, '#4a2a12'); rect(f ? x + 8 : x + 6, y + 9, 4, 3, '#4a2a12');
    }
    cx.restore();
  }
  function drawItem(m) {
    var x = Math.floor(m.x), y = Math.floor(m.y);
    rect(x + 2, y + 6, 8, 6, '#fff3d0'); cx.fillStyle = '#e8505b'; cx.beginPath(); cx.arc(x + 6, y + 6, 6, Math.PI, 0); cx.fill(); rect(x, y + 5, 12, 2, '#e8505b');
    rect(x + 2, y + 2, 3, 3, '#fff'); rect(x + 7, y + 3, 3, 2, '#fff'); rect(x + 4, y + 8, 1, 2, '#000'); rect(x + 7, y + 8, 1, 2, '#000');
  }

  function draw() {
    var th = THEME[wi()], c0, c1, r, c, i;
    cx.setTransform(D, 0, 0, D, 0, 0);
    var g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th[0]); g.addColorStop(1, th[1]); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.setTransform(D * S, 0, 0, D * S, 0, D * offY);
    if (th[4]) { cx.fillStyle = '#fff'; STARS.forEach(function (s) { cx.beginPath(); cx.arc(s[0] * visW, s[1] * ROWS * T, s[2], 0, 7); cx.fill(); }); cx.fillStyle = '#f4f1c9'; cx.beginPath(); cx.arc(visW * .8, 40, 16, 0, 7); cx.fill(); }
    cx.fillStyle = 'rgba(255,255,255,.85)';
    for (i = 0; i < 8; i++) { var cxp = ((i * 190 - cam * .25) % (visW + 260) + visW + 260) % (visW + 260) - 100, cyp = 25 + (i * 37) % 60; cx.beginPath(); cx.arc(cxp, cyp, 12, 0, 7); cx.arc(cxp + 14, cyp + 3, 10, 0, 7); cx.arc(cxp - 14, cyp + 4, 9, 0, 7); cx.fill(); }
    cx.fillStyle = th[3];
    for (i = -1; i < visW / 120 + 2; i++) { var hx = i * 120 - (cam * .35) % 120; cx.beginPath(); cx.ellipse(hx + 60, 13 * T, 70, 38, 0, Math.PI, 0); cx.fill(); }
    cx.fillStyle = th[2];
    for (i = -1; i < visW / 90 + 2; i++) { var bx = i * 90 - (cam * .6) % 90 + 20; cx.beginPath(); cx.ellipse(bx + 25, 13 * T, 32, 18, 0, Math.PI, 0); cx.fill(); }
    cx.save(); cx.translate(-Math.floor(cam), 0);
    var fcx = FC * T;
    rect((LEN - 6) * T, 9 * T, 4 * T, 4 * T, '#9a6b4a'); rect((LEN - 5) * T + 8, 7 * T, 3 * T, 2 * T, '#9a6b4a'); rect((LEN - 5) * T + 24, 11 * T, 14, 2 * T, '#2a1a10');
    for (i = 0; i < 4; i++) rect((LEN - 6) * T + i * 16 + 2, 9 * T - 4, 8, 4, '#9a6b4a');
    items.forEach(drawItem);
    c0 = Math.max(0, Math.floor(cam / T)); c1 = Math.min(LEN - 1, Math.floor((cam + visW) / T) + 1);
    cx.textAlign = 'center';
    for (r = 0; r < ROWS; r++) for (c = c0; c <= c1; c++) {
      var ch = G[r][c]; if (ch === '.') continue;
      var oy = 0; for (var k = 0; k < bumps.length; k++) if (bumps[k].c === c && bumps[k].r === r) oy = -Math.sin(bumps[k].t / 10 * Math.PI) * 5;
      drawTile(ch, c * T, r * T + oy, c, r);
    }
    cx.fillStyle = '#e8505b'; cx.beginPath(); cx.moveTo(fcx + 8, flagY); cx.lineTo(fcx + 8 - 14, flagY + 5); cx.lineTo(fcx + 8, flagY + 10); cx.fill();
    enemies.forEach(drawEnemy);
    parts.forEach(function (p) {
      if (p.coin) { cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.ellipse(p.x + 4, p.y, Math.abs(Math.cos(p.t / 3)) * 4 + 1, 5, 0, 0, 7); cx.fill(); }
      else rect(p.x, p.y, 6, 6, '#c8582a');
    });
    drawPlayer();
    cx.font = 'bold 8px monospace'; cx.textAlign = 'center';
    pops.forEach(function (p) { cx.fillStyle = '#fff'; cx.fillText(p.s, p.x + 6, p.y); });
    cx.restore();
    cx.setTransform(D, 0, 0, D, 0, 0);
    cx.fillStyle = '#12122a'; cx.fillRect(0, offY + ROWS * T * S, W, H);
    var fs = Math.max(11, Math.min(14, W * .03)); cx.font = 'bold ' + fs + 'px "Courier New",monospace'; cx.textBaseline = 'top'; cx.lineWidth = 3; cx.strokeStyle = 'rgba(0,0,0,.6)';
    function txt(s, x, y, al) { cx.textAlign = al; cx.strokeText(s, x, y); cx.fillStyle = '#fff'; cx.fillText(s, x, y); }
    txt('SCORE ' + ('000000' + score).slice(-6), 8, 6, 'left');
    txt('COINS x' + ('0' + coins).slice(-2), 8, 6 + fs * 1.3, 'left');
    txt('WORLD ' + wl(), W / 2, 6, 'center');
    txt('LIVES x' + Math.max(0, lives), W / 2, 6 + fs * 1.3, 'center');
    txt('TIME ' + time, W - 8, 6, 'right');
    if (state === 'intro') { cx.font = 'bold ' + Math.max(22, W * .05) + 'px "Courier New",monospace'; txt('WORLD ' + wl(), W / 2, H * .35, 'center'); cx.font = 'bold ' + fs + 'px "Courier New",monospace'; txt('Get ready!', W / 2, H * .35 + 40, 'center'); }
    if (state === 'clear') { cx.font = 'bold ' + Math.max(20, W * .045) + 'px "Courier New",monospace'; txt('LEVEL CLEAR!', W / 2, H * .3, 'center'); }
  }

  var last = 0, acc = 0;
  function loop(ts) {
    var dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts; acc += dt;
    while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
    draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= CONTROLS ================= */
  function newGame(s) {
    actx(); score = 0; coins = 0; lives = LIVES[diff]; $('ov').style.display = 'none'; loadLevel(typeof s === 'number' ? s : 0, false);
  }
  function buildMenu() {
    var d = $('diff'), g = $('lvls'), prog = +ls('sj_prog') || 0, i;
    d.innerHTML = ''; g.innerHTML = '';
    DN.forEach(function (n, i) {
      var b = document.createElement('button'); b.className = 'chip' + (i === diff ? ' on' : ''); b.textContent = n;
      b.onclick = function () { diff = i; sv('sj_diff', i); buildMenu(); }; d.appendChild(b);
    });
    for (i = 0; i < LEVELS; i++) (function (i) {
      var b = document.createElement('button'); b.className = 'lv' + (i > prog ? ' lock' : ''); b.textContent = (Math.floor(i / 6) + 1) + '-' + (i % 6 + 1);
      b.onclick = function () { if (i <= prog) newGame(i); }; g.appendChild(b);
    })(i);
  }
  var KEYMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'j', w: 'j', W: 'j', ' ': 'j', Shift: 'b', z: 'b', Z: 'b', x: 'b', X: 'b' };
  document.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.key];
    if (k) { K[k] = 1; e.preventDefault(); }
    if (e.key === 'Enter' && $('ov').style.display !== 'none') newGame();
  });
  document.addEventListener('keyup', function (e) { var k = KEYMAP[e.key]; if (k) K[k] = 0; });
  window.addEventListener('blur', function () { K.l = K.r = K.j = K.b = 0; });
  [['bl', 'l'], ['br', 'r'], ['bj', 'j'], ['bb', 'b']].forEach(function (b) {
    var el = $(b[0]);
    function on(e) { e.preventDefault(); K[b[1]] = 1; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (x) {} }
    function off(e) { e.preventDefault(); K[b[1]] = 0; el.classList.remove('on'); }
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
  if ('ontouchstart' in window || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches)) $('tc').style.display = 'block';
  $('go').onclick = newGame;
  $('mute').onclick = function () { muted = !muted; this.textContent = muted ? '🔕' : '🔔'; };
  $('mus').onclick = function () { musicOn = !musicOn; this.style.opacity = musicOn ? 1 : .45; music(state === 'play'); };
  if (best) $('stats').innerHTML = '🏅 Best: ' + best;
  buildMenu(); loadLevel(0, false); state = 'title';
})();
</script>
