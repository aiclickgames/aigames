<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Car Simulator</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f1c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;display:block}
  button{font:inherit;color:#fff;cursor:pointer;border:0}
  .ui{position:fixed;z-index:5}
  .pill{background:rgba(19,21,40,.8);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 16px;font-weight:800;backdrop-filter:blur(6px);display:inline-block}
  .round{width:46px;height:46px;border-radius:50%;background:rgba(32,36,63,.88);font-size:1.15rem;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1)}
  .round:hover,.round:active{background:#7c5cff}

  /* ---------- Garage ---------- */
  #garage{inset:0;pointer-events:none}
  #gtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  #gtop .brand{font-size:1.1rem;letter-spacing:.03em}
  .arrow{position:absolute;top:44%;pointer-events:auto}
  #prev{left:10px}#next{right:10px}
  #panel{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(94vw,560px);background:rgba(19,21,40,.88);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px 16px 14px;pointer-events:auto;backdrop-filter:blur(8px)}
  #chead{display:flex;align-items:baseline;gap:10px}
  #cname{font-size:1.5rem;font-weight:900;letter-spacing:.02em}
  #ctype{color:#9aa0c3;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 10px}
  .st small{display:block;color:#9aa0c3;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .bar{height:7px;border-radius:99px;background:#20243f;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c5cff,#7cffc4)}
  #sw{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  #sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  #sw button.on{border-color:#fff}
  #drive{width:100%;height:48px;border-radius:999px;background:#7c5cff;font-weight:900;font-size:1.15rem;letter-spacing:.08em;box-shadow:0 8px 24px rgba(124,92,255,.45)}
  #drive:hover{filter:brightness(1.12)}
  #ghint{text-align:center;color:#9aa0c3;font-size:.72rem;margin-top:8px}

  /* ---------- HUD ---------- */
  #hud{inset:0;pointer-events:none;display:none}
  body.drive #hud{display:block}
  body.drive #garage{display:none}
  #hl{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  #hr{position:absolute;top:12px;right:12px;display:flex;gap:8px;pointer-events:auto}
  #drift{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-weight:900;font-size:1.5rem;color:#ffd24a;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;white-space:nowrap}
  #gauge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);text-align:center;min-width:180px}
  #spd{font-size:2.6rem;font-weight:900;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  #spd small{font-size:.8rem;color:#c8ccec;margin-left:4px}
  #nb{height:9px;border-radius:99px;background:rgba(19,21,40,.8);margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
  #nb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a1f,#ffd24a)}
  #tip{position:absolute;left:50%;top:116px;transform:translateX(-50%);color:#e9ebff;background:rgba(19,21,40,.7);padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700;transition:opacity .6s;white-space:nowrap}

  /* ---------- Touch controls ---------- */
  #ctl{inset:0;pointer-events:none;display:none}
  .cl,.cr{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;pointer-events:auto}
  .cl{left:14px;grid-template-columns:repeat(2,72px)}
  .cr{right:14px;grid-template-columns:repeat(2,72px)}
  #ctl button{height:72px;border-radius:20px;background:rgba(32,36,63,.78);border:1px solid rgba(255,255,255,.14);font-size:1.5rem;font-weight:900;touch-action:none}
  #ctl button.on{background:#7c5cff}
  #ctl .gas{background:rgba(61,220,74,.45)}
  #ctl .brake{background:rgba(229,48,58,.45)}
  #ctl .nos{font-size:1.2rem;background:rgba(255,138,31,.5)}
  #ctl .dr{font-size:.8rem;letter-spacing:.05em}
  @media (pointer:coarse){body.drive #ctl{display:block}body.drive #gauge{bottom:calc(110px + env(safe-area-inset-bottom,0px));pointer-events:none}body.drive #spd{font-size:2rem}#ghint{display:none}}

  @media (max-height:540px){
    #panel{left:auto;right:12px;bottom:50%;transform:translateY(50%);width:250px}
    #gauge{bottom:10px}
    #tip{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- Garage UI -->
<div id="garage" class="ui">
  <div id="gtop">
    <div class="pill brand">🚗 Car Simulator</div>
    <div class="pill">🪙 <b id="gcoins">0</b></div>
  </div>
  <button id="prev" class="round arrow" aria-label="Previous car" type="button">&#9664;</button>
  <button id="next" class="round arrow" aria-label="Next car" type="button">&#9654;</button>
  <div id="panel">
    <div id="chead"><div id="cname">Bolt</div><div id="ctype">Sport</div></div>
    <div class="stats">
      <div class="st"><small>Speed</small><div class="bar"><i id="b1"></i></div></div>
      <div class="st"><small>Acceleration</small><div class="bar"><i id="b2"></i></div></div>
      <div class="st"><small>Handling</small><div class="bar"><i id="b3"></i></div></div>
    </div>
    <div id="sw"></div>
    <button id="drive" type="button">DRIVE</button>
    <div id="ghint">&#8592; &#8594; to choose a car &middot; Enter to drive</div>
  </div>
</div>

<!-- Driving HUD -->
<div id="hud" class="ui">
  <div id="hl"><div class="pill">🪙 <b id="coins">0</b></div></div>
  <div id="hr">
    <button class="round" id="mute" type="button" aria-label="Sound">🔊</button>
    <button class="round" id="back" type="button" aria-label="Garage">🏠</button>
  </div>
  <div id="drift"></div>
  <div id="tip">W/A/S/D or arrows to drive &middot; Space = drift &middot; Shift = nitro &middot; collect coins</div>
  <div id="gauge"><div id="spd">0<small>KM/H</small></div><div id="nb"><i id="nf"></i></div></div>
</div>

<!-- Touch controls -->
<div id="ctl" class="ui">
  <div class="cl"><button data-k="left" type="button">&#9664;</button><button data-k="right" type="button">&#9654;</button></div>
  <div class="cr">
    <button class="nos" data-k="nitro" type="button">&#9889;</button>
    <button class="gas" data-k="gas" type="button">&#9650;</button>
    <button class="dr" data-k="drift" type="button">DRIFT</button>
    <button class="brake" data-k="brake" type="button">&#9660;</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var cv = $('cv'), c = cv.getContext('2d'), W = 0, H = 0, DPR = 1;

  /* ================= DATA ================= */
  var CARS = [
    { name: 'Bolt',    type: 'sport', color: '#2f7bff', max: 610, acc: 430, turn: 2.7,  grip: 6.6, L: 92, Wd: 44 },
    { name: 'Blaze',   type: 'sport', color: '#ff8a1f', max: 575, acc: 470, turn: 2.9,  grip: 5.4, L: 90, Wd: 44 },
    { name: 'Viper',   type: 'sport', color: '#3ddc4a', max: 545, acc: 440, turn: 3.05, grip: 6.0, L: 88, Wd: 43 },
    { name: 'Crimson', type: 'sport', color: '#e5303a', max: 630, acc: 400, turn: 2.5,  grip: 7.0, L: 94, Wd: 44 },
    { name: 'Titan',   type: 'suv',   color: '#f2f2f2', max: 480, acc: 360, turn: 2.3,  grip: 8.0, L: 92, Wd: 48 }
  ];
  var COLORS = ['#2f7bff', '#ff8a1f', '#3ddc4a', '#e5303a', '#f2f2f2', '#ffd93b', '#a24bff', '#ff4fa3', '#1f2430'];

  var save = { sel: 0, coins: 0, cols: CARS.map(function (x) { return x.color; }) };
  try {
    var s0 = JSON.parse(localStorage.getItem('carsim_v1'));
    if (s0) {
      save.sel = Math.max(0, Math.min(CARS.length - 1, s0.sel | 0));
      save.coins = s0.coins | 0;
      if (s0.cols && s0.cols.length === CARS.length) save.cols = s0.cols;
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem('carsim_v1', JSON.stringify(save)); } catch (e) {} }

  /* ================= HELPERS ================= */
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function f(v) { return Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt))); }
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ================= WORLD ================= */
  var BLOCK = 380, ROAD = 150, PITCH = BLOCK + ROAD, CELLS = 9, WORLD = CELLS * PITCH + ROAD;
  var blocks = [], parks = [], trees = [], bld = [], coinsArr = [];
  var mm = document.createElement('canvas'); mm.width = mm.height = 130;

  function buildWorld() {
    var R = rng(20261113);
    var pal = ['#c9d1e8', '#e0b9a8', '#b8d8c8', '#e8d9a0', '#a9b7d9', '#d9a9c4', '#9fc5d6', '#cfcfd6'];
    for (var i = 0; i < CELLS; i++) for (var j = 0; j < CELLS; j++) {
      var bx = i * PITCH + ROAD, by = j * PITCH + ROAD;
      blocks.push({ x: bx, y: by });
      if (R() < 0.16) {
        parks.push({ x: bx, y: by });
        for (var k = 0; k < 9; k++) trees.push({ x: bx + 30 + R() * (BLOCK - 60), y: by + 30 + R() * (BLOCK - 60), r: 14 + R() * 10 });
        continue;
      }
      var pad = 14, gap = 12, cw = (BLOCK - pad * 2 - gap) / 2;
      for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) {
        if (R() < 0.12) continue;
        var ins = R() * 14;
        bld.push({ x: bx + pad + a * (cw + gap) + ins, y: by + pad + b * (cw + gap) + ins, w: cw - ins * 2, h: cw - ins * 2, c: pal[Math.floor(R() * pal.length)], hh: 6 + R() * 10 });
      }
    }
    // minimap
    var m = mm.getContext('2d'), ms = 130 / WORLD;
    m.fillStyle = '#2c3040'; m.fillRect(0, 0, 130, 130);
    m.fillStyle = '#4d5368'; blocks.forEach(function (b) { m.fillRect(b.x * ms, b.y * ms, BLOCK * ms, BLOCK * ms); });
    m.fillStyle = '#2f6b3a'; parks.forEach(function (b) { m.fillRect(b.x * ms, b.y * ms, BLOCK * ms, BLOCK * ms); });
    m.fillStyle = '#8a90aa'; bld.forEach(function (b) { m.fillRect(b.x * ms, b.y * ms, b.w * ms, b.h * ms); });
    for (var q = 0; q < 70; q++) coinsArr.push(newCoin());
  }
  function newCoin() {
    var vert = Math.random() < 0.5, line = Math.floor(Math.random() * (CELLS + 1)) * PITCH + ROAD / 2 + (Math.random() - 0.5) * 70;
    var along = 60 + Math.random() * (WORLD - 120);
    return { x: vert ? line : along, y: vert ? along : line, p: Math.random() * 6 };
  }

  /* ================= STATE ================= */
  var mode = 'garage', sel = save.sel, selF = sel, T = 0;
  var car = null, cam = { x: 0, y: 0 }, shake = 0;
  var skids = [], parts = [], nitroOn = false, driftT = 0, driftPts = 0, driftShow = 0;
  var keys = { up: 0, down: 0, left: 0, right: 0, space: 0, shift: 0 };
  var touch = { left: 0, right: 0, gas: 0, brake: 0, nitro: 0, drift: 0 };
  var sessionCoins = 0;

  /* ================= AUDIO ================= */
  var AC = null, osc = null, gain = null, muted = false;
  function audioInit() {
    if (AC) { try { AC.resume(); } catch (e) {} return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      osc = AC.createOscillator(); osc.type = 'sawtooth';
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
      gain = AC.createGain(); gain.gain.value = 0;
      osc.connect(lp); lp.connect(gain); gain.connect(AC.destination); osc.start();
    } catch (e) { AC = null; }
  }
  function beep(f, d) {
    if (!AC || muted) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = f; g.gain.value = 0.045;
      o.connect(g); g.connect(AC.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
    } catch (e) {}
  }
  function engine() {
    if (!AC || !gain) return;
    var on = mode === 'drive' && !muted && car;
    try {
      gain.gain.setTargetAtTime(on ? 0.03 : 0, AC.currentTime, 0.05);
      if (on) osc.frequency.setTargetAtTime(48 + Math.abs(car.vf || 0) * 0.2 + (nitroOn ? 40 : 0), AC.currentTime, 0.06);
    } catch (e) {}
  }

  /* ================= GARAGE UI ================= */
  function refreshGarage() {
    var d = CARS[sel];
    $('cname').textContent = d.name;
    $('ctype').textContent = d.type === 'suv' ? 'Off-road SUV' : 'Sports car';
    $('b1').style.width = Math.round(clamp(d.max / 650, 0, 1) * 100) + '%';
    $('b2').style.width = Math.round(clamp(d.acc / 480, 0, 1) * 100) + '%';
    $('b3').style.width = Math.round(clamp(d.turn / 3.2, 0, 1) * 100) + '%';
    $('gcoins').textContent = save.coins;
    var sw = $('sw'); sw.innerHTML = '';
    COLORS.forEach(function (col) {
      var b = document.createElement('button'); b.type = 'button'; b.style.background = col; b.setAttribute('aria-label', 'Color ' + col);
      if (save.cols[sel] === col) b.className = 'on';
      b.onclick = function () { save.cols[sel] = col; persist(); refreshGarage(); };
      sw.appendChild(b);
    });
  }
  function choose(dir) { sel = (sel + dir + CARS.length) % CARS.length; if (sel - selF > CARS.length / 2) selF += CARS.length; else if (sel - selF < -CARS.length / 2) selF -= CARS.length; save.sel = sel; persist(); refreshGarage(); }
  $('prev').onclick = function () { choose(-1); };
  $('next').onclick = function () { choose(1); };
  $('drive').onclick = startDrive;
  $('back').onclick = toGarage;
  $('mute').onclick = function () { muted = !muted; this.textContent = muted ? '🔇' : '🔊'; };

  /* ================= MODES ================= */
  function startDrive() {
    audioInit();
    var d = CARS[sel];
    car = {
      name: d.name, type: d.type, max: d.max, acc: d.acc, turn: d.turn, grip: d.grip, L: d.L, Wd: d.Wd, color: save.cols[sel],
      x: 4 * PITCH + ROAD / 2, y: 4 * PITCH + ROAD / 2 + 200, a: -Math.PI / 2, vx: 0, vy: 0, vf: 0, steer: 0, nrg: 100, braking: false, drift: false
    };
    cam.x = car.x; cam.y = car.y;
    skids.length = 0; parts.length = 0; driftPts = 0; driftT = 0; sessionCoins = 0;
    mode = 'drive'; document.body.className = 'drive';
    $('coins').textContent = save.coins;
    var tip = $('tip'); tip.style.opacity = 1; tip.style.display = '';
    setTimeout(function () { tip.style.opacity = 0; }, 6000);
  }
  function toGarage() {
    mode = 'garage'; document.body.className = ''; persist(); refreshGarage(); engine();
    keys.up = keys.down = keys.left = keys.right = keys.space = keys.shift = 0;
    for (var k in touch) touch[k] = 0;
  }

  /* ================= INPUT ================= */
  var KMAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'space', Shift: 'shift', n: 'shift', N: 'shift' };
  window.addEventListener('keydown', function (e) {
    var k = KMAP[e.key];
    if (mode === 'garage') {
      if (e.key === 'ArrowLeft') { e.preventDefault(); choose(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); choose(1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startDrive(); }
      return;
    }
    if (k) { e.preventDefault(); keys[k] = 1; }
    else if (e.key === 'r' || e.key === 'R') { car.x = 4 * PITCH + ROAD / 2; car.y = 4 * PITCH + ROAD / 2 + 200; car.a = -Math.PI / 2; car.vx = car.vy = 0; }
    else if (e.key === 'g' || e.key === 'G' || e.key === 'Escape') toGarage();
  });
  window.addEventListener('keyup', function (e) { var k = KMAP[e.key]; if (k) keys[k] = 0; });
  window.addEventListener('blur', function () { for (var k in keys) keys[k] = 0; for (var t in touch) touch[t] = 0; });

  Array.prototype.forEach.call(document.querySelectorAll('#ctl button'), function (b) {
    var k = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); touch[k] = 1; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (x) {} }
    function off(e) { e.preventDefault(); touch[k] = 0; b.classList.remove('on'); }
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // swipe in garage
  var gx = 0;
  cv.addEventListener('pointerdown', function (e) { gx = e.clientX; });
  cv.addEventListener('pointerup', function (e) {
    if (mode !== 'garage') return;
    var dx = e.clientX - gx;
    if (Math.abs(dx) > 40) choose(dx < 0 ? 1 : -1);
  });

  /* ================= PHYSICS ================= */
  function physics(h) {
    var gas = keys.up || touch.gas, brk = keys.down || touch.brake, L = keys.left || touch.left, R = keys.right || touch.right;
    var hb = keys.space || touch.drift, nos = keys.shift || touch.nitro;
    var thr = (gas ? 1 : 0) - (brk ? 1 : 0), st = (R ? 1 : 0) - (L ? 1 : 0);

    var fx = Math.cos(car.a), fy = Math.sin(car.a);
    var vf0 = car.vx * fx + car.vy * fy, spd = Math.abs(vf0);
    car.steer += (st - car.steer) * Math.min(1, h * 9);
    var tf = Math.min(1, spd / 150) * (vf0 < 0 ? -1 : 1);
    car.a += car.steer * car.turn * (1 - 0.3 * Math.min(1, spd / car.max)) * (hb ? 1.35 : 1) * tf * h;

    fx = Math.cos(car.a); fy = Math.sin(car.a);
    var rx = -fy, ry = fx;
    var vf = car.vx * fx + car.vy * fy, vl = car.vx * rx + car.vy * ry;

    var boost = 1, acc = car.acc;
    nitroOn = false;
    if (nos && car.nrg > 0 && vf > 20 && thr >= 0) { nitroOn = true; boost = 1.42; acc *= 2.2; thr = 1; car.nrg = Math.max(0, car.nrg - 30 * h); }
    else car.nrg = Math.min(100, car.nrg + 7 * h);
    var vmax = car.max * boost;

    car.braking = false;
    if (thr > 0) { vf += acc * (1 - Math.max(0, vf) / vmax) * h; }
    else if (thr < 0) {
      if (vf > 8) { vf -= 1100 * h; car.braking = true; }
      else vf = Math.max(-170, vf - acc * 0.55 * h);
    } else {
      var fr = 140 * h; vf = Math.abs(vf) <= fr ? 0 : vf - (vf > 0 ? fr : -fr);
    }
    if (vf > vmax) vf = vmax + (vf - vmax) * Math.exp(-1.6 * h);
    vf *= Math.exp(-(hb ? 0.9 : 0.12) * h);
    vl *= Math.exp(-(hb ? 1.3 : car.grip) * h);

    car.vx = fx * vf + rx * vl; car.vy = fy * vf + ry * vl; car.vf = vf;
    car.x += car.vx * h; car.y += car.vy * h;
    collide(car);
    car.x = clamp(car.x, 24, WORLD - 24); car.y = clamp(car.y, 24, WORLD - 24);

    // drift + skids
    car.drift = Math.abs(vl) > 100 && Math.abs(vf) > 120;
    if (car.drift) { driftPts += Math.abs(vl) * h * 0.05; driftT = 0.8; }
    else if (driftT > 0) {
      driftT -= h;
      if (driftT <= 0) {
        var bank = Math.floor(driftPts / 5);
        if (bank > 0) { save.coins += bank; sessionCoins += bank; beep(880, 0.15); }
        driftPts = 0;
      }
    }
    if (car.drift || car.braking && vf > 200 || (hb && vf > 150)) {
      var px = car.x - fx * car.L * 0.32, py = car.y - fy * car.L * 0.32, o = car.Wd * 0.38;
      skids.push({ x: px + rx * o, y: py + ry * o, l: 1 }, { x: px - rx * o, y: py - ry * o, l: 1 });
      if (skids.length > 700) skids.splice(0, 2);
      if (Math.random() < 0.5) parts.push({ x: px, y: py, vx: -fx * 20 + (Math.random() - .5) * 40, vy: -fy * 20 + (Math.random() - .5) * 40, l: 0.7, m: 0.7, col: 'rgba(210,210,220,', r: 7 });
    }
    if (nitroOn) {
      var ex = car.x - fx * car.L * 0.5, ey = car.y - fy * car.L * 0.5;
      for (var i = 0; i < 2; i++) parts.push({ x: ex, y: ey, vx: -fx * (160 + Math.random() * 120) + (Math.random() - .5) * 50, vy: -fy * (160 + Math.random() * 120) + (Math.random() - .5) * 50, l: 0.35, m: 0.35, col: Math.random() < 0.5 ? 'rgba(255,170,40,' : 'rgba(90,200,255,', r: 6 });
    }
  }

  function collide(cr) {
    var fx = Math.cos(cr.a), fy = Math.sin(cr.a), rad = cr.Wd * 0.55, offs = [cr.L * 0.27, -cr.L * 0.27];
    for (var o = 0; o < 2; o++) {
      var px = cr.x + fx * offs[o], py = cr.y + fy * offs[o];
      for (var i = 0; i < bld.length; i++) {
        var b = bld[i];
        if (px < b.x - rad || px > b.x + b.w + rad || py < b.y - rad || py > b.y + b.h + rad) continue;
        var cx2 = clamp(px, b.x, b.x + b.w), cy2 = clamp(py, b.y, b.y + b.h), dx = px - cx2, dy = py - cy2, d2 = dx * dx + dy * dy;
        if (d2 >= rad * rad) continue;
        var nx, ny, pen;
        if (d2 < 0.0001) {
          var l = px - b.x, r = b.x + b.w - px, t = py - b.y, bt = b.y + b.h - py, m = Math.min(l, r, t, bt);
          if (m === l) { nx = -1; ny = 0; } else if (m === r) { nx = 1; ny = 0; } else if (m === t) { nx = 0; ny = -1; } else { nx = 0; ny = 1; }
          pen = m + rad;
        } else { var d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = rad - d; }
        cr.x += nx * pen; cr.y += ny * pen; px += nx * pen; py += ny * pen;
        var vn = cr.vx * nx + cr.vy * ny;
        if (vn < 0) {
          cr.vx -= 1.35 * vn * nx; cr.vy -= 1.35 * vn * ny; cr.vx *= 0.93; cr.vy *= 0.93;
          if (-vn > 120) { shake = Math.min(14, -vn * 0.03); beep(90, 0.12); }
        }
      }
    }
  }

  function update(dt) {
    var n = Math.max(1, Math.ceil(dt / 0.017)), h = dt / n;
    for (var i = 0; i < n; i++) physics(h);
    var tx = car.x + car.vx * 0.22, ty = car.y + car.vy * 0.22;
    cam.x += (tx - cam.x) * Math.min(1, dt * 5); cam.y += (ty - cam.y) * Math.min(1, dt * 5);
    // coins
    for (var k = 0; k < coinsArr.length; k++) {
      var cn = coinsArr[k], dx = cn.x - car.x, dy = cn.y - car.y;
      if (dx * dx + dy * dy < 36 * 36) {
        save.coins++; sessionCoins++; car.nrg = Math.min(100, car.nrg + 18); beep(1200, 0.08);
        coinsArr[k] = newCoin();
      }
    }
    for (var s = skids.length - 1; s >= 0; s--) { skids[s].l -= dt * 0.12; if (skids[s].l <= 0) skids.splice(s, 1); }
    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p]; q.l -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.l <= 0) parts.splice(p, 1);
    }
    shake *= Math.exp(-8 * dt);
    engine();
  }

  /* ================= DRAW: GARAGE ================= */
  function drawFront(x, y, s, col, type, alpha) {
    c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = alpha;
    var suv = type === 'suv';
    var bh = suv ? 78 : 58, wh = suv ? 78 : 62, ch = suv ? 66 : 48, cw = suv ? 120 : 106, tw = suv ? 108 : 72;
    var lb = -18, lt = lb - bh;
    // shadow
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, -2, 175, 16, 0, 0, 7); c.fill();
    // wheels
    c.fillStyle = '#10121c'; rr(-152, -wh, 46, wh - 4, 10); c.fill(); rr(106, -wh, 46, wh - 4, 10); c.fill();
    c.fillStyle = '#262a40'; rr(-146, -wh + 6, 8, wh - 16, 4); c.fill(); rr(138, -wh + 6, 8, wh - 16, 4); c.fill();
    // cabin
    c.fillStyle = shade(col, -0.12);
    c.beginPath(); c.moveTo(-cw, lt + 8); c.lineTo(-tw, lt - ch); c.lineTo(tw, lt - ch); c.lineTo(cw, lt + 8); c.closePath(); c.fill();
    var gg = c.createLinearGradient(0, lt - ch, 0, lt);
    gg.addColorStop(0, '#34406a'); gg.addColorStop(1, '#0e1222');
    c.fillStyle = gg;
    c.beginPath(); c.moveTo(-cw + 16, lt + 2); c.lineTo(-tw + 10, lt - ch + 9); c.lineTo(tw - 10, lt - ch + 9); c.lineTo(cw - 16, lt + 2); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.13)';
    c.beginPath(); c.moveTo(-cw + 40, lt + 2); c.lineTo(-tw + 24, lt - ch + 9); c.lineTo(-tw + 54, lt - ch + 9); c.lineTo(-cw + 76, lt + 2); c.closePath(); c.fill();
    // mirrors
    c.fillStyle = shade(col, -0.2); rr(-cw - 12, lt - 2, 16, 12, 5); c.fill(); rr(cw - 4, lt - 2, 16, 12, 5); c.fill();
    // lower body
    var bg = c.createLinearGradient(0, lt, 0, lb);
    bg.addColorStop(0, shade(col, 0.3)); bg.addColorStop(0.45, col); bg.addColorStop(1, shade(col, -0.35));
    c.fillStyle = bg; rr(-152, lt, 304, bh, 24); c.fill();
    c.fillStyle = 'rgba(255,255,255,.2)'; rr(-118, lt + 5, 236, 14, 7); c.fill();
    // headlights
    c.save(); c.shadowColor = '#bfe6ff'; c.shadowBlur = 18; c.fillStyle = '#f4fbff';
    c.beginPath(); c.moveTo(-140, lt + 16); c.lineTo(-68, lt + 10); c.lineTo(-78, lt + 34); c.lineTo(-136, lt + 36); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(140, lt + 16); c.lineTo(68, lt + 10); c.lineTo(78, lt + 34); c.lineTo(136, lt + 36); c.closePath(); c.fill();
    c.restore();
    c.strokeStyle = '#3a4a6c'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-132, lt + 26); c.lineTo(-84, lt + 24); c.moveTo(132, lt + 26); c.lineTo(84, lt + 24); c.stroke();
    // grille + intakes
    c.fillStyle = '#10121c'; rr(-66, lb - 36, 132, 28, 9); c.fill();
    c.strokeStyle = '#2d3248'; c.lineWidth = 2;
    for (var i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-58, lb - 36 + i * 7); c.lineTo(58, lb - 36 + i * 7); c.stroke(); }
    c.fillStyle = '#10121c'; rr(-134, lb - 30, 50, 22, 7); c.fill(); rr(84, lb - 30, 50, 22, 7); c.fill();
    // badge
    c.fillStyle = '#e8e9f2'; c.beginPath(); c.arc(0, lt + 26, 6, 0, 7); c.fill();
    // splitter
    c.fillStyle = '#0d0f19'; rr(-150, -24, 300, 9, 4); c.fill();
    c.restore();
  }

  function drawGarage() {
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var compact = H < 540;
    var cxm = compact ? W * 0.34 : W / 2;
    var groundY = compact ? H * 0.8 : Math.max(H * 0.52, H - 250);
    var s0 = Math.min((compact ? W * 0.5 : W * 0.5) / 300, (groundY - 80) / 165);
    var floorY = groundY - 80 * s0;

    var g = c.createLinearGradient(0, 0, 0, floorY);
    g.addColorStop(0, '#171538'); g.addColorStop(1, '#2d2b60');
    c.fillStyle = g; c.fillRect(0, 0, W, floorY);

    // back wall panels
    var pw = Math.min(W * 0.24, 250), py = compact ? 14 : 72, ph = Math.max(34, Math.min(110, floorY - py - 34));
    var pn = ['SUPER', 'SPEED', 'DRIFT'], pc = ['#ff3d6e', '#2f7bff', '#ffb020'];
    for (var i = 0; i < 3; i++) {
      var px = cxm + (i - 1) * (pw + 14) - pw / 2;
      c.fillStyle = 'rgba(255,255,255,.07)'; rr(px, py, pw, ph, 10); c.fill();
      c.fillStyle = pc[i]; rr(px, py, pw, Math.min(26, ph * 0.3), 10); c.fill();
      c.fillStyle = '#fff'; c.font = '900 ' + Math.max(11, Math.min(15, ph * 0.18)) + 'px system-ui,sans-serif'; c.textAlign = 'center';
      c.fillText(pn[i], px + pw / 2, py + Math.min(26, ph * 0.3) * 0.7);
      c.fillStyle = 'rgba(255,255,255,.1)'; rr(px + 10, py + ph * 0.45, pw - 20, ph * 0.12, 4); c.fill(); rr(px + 10, py + ph * 0.68, pw * 0.6, ph * 0.1, 4); c.fill();
    }
    // floor
    g = c.createLinearGradient(0, floorY, 0, H);
    g.addColorStop(0, '#dfe1ee'); g.addColorStop(1, '#8f93ad');
    c.fillStyle = g; c.fillRect(0, floorY, W, H - floorY);
    c.strokeStyle = 'rgba(40,44,80,.12)'; c.lineWidth = 1;
    for (var l = -8; l <= 8; l++) { c.beginPath(); c.moveTo(cxm + l * 40 * s0, floorY); c.lineTo(cxm + l * 160 * s0, H); c.stroke(); }
    for (var r2 = 1; r2 < 6; r2++) { var yy = floorY + (H - floorY) * Math.pow(r2 / 6, 1.7); c.beginPath(); c.moveTo(0, yy); c.lineTo(W, yy); c.stroke(); }

    // turntable
    c.save(); c.shadowColor = '#7c5cff'; c.shadowBlur = 24;
    c.fillStyle = 'rgba(124,92,255,.22)'; c.beginPath(); c.ellipse(cxm, groundY - 6 * s0, 215 * s0, 38 * s0, 0, 0, 7); c.fill();
    c.strokeStyle = '#7c5cff'; c.lineWidth = 3; c.stroke(); c.restore();

    // cars carousel
    var order = [];
    for (var k = 0; k < CARS.length; k++) {
      var pos = k - selF;
      if (pos > CARS.length / 2) pos -= CARS.length; else if (pos < -CARS.length / 2) pos += CARS.length;
      if (Math.abs(pos) < 2.7) order.push({ i: k, pos: pos });
    }
    order.sort(function (a, b) { return Math.abs(b.pos) - Math.abs(a.pos); });
    order.forEach(function (o) {
      var ap = Math.abs(o.pos), s = s0 * Math.max(0.3, 1 - ap * 0.3);
      var x = cxm + o.pos * 235 * s0 * (1 - 0.05 * ap), y = groundY - ap * 14 * s0;
      drawFront(x, y, s, save.cols[o.i], CARS[o.i].type, clamp(1 - ap * 0.22, 0.35, 1));
    });
  }

  /* ================= DRAW: WORLD ================= */
  function drawTop(cr, col) {
    c.save(); c.translate(cr.x, cr.y); c.rotate(cr.a);
    var L = cr.L, Wd = cr.Wd, suv = cr.type === 'suv';
    c.fillStyle = 'rgba(0,0,0,.3)'; rr(-L / 2 + 3, -Wd / 2 + 4, L, Wd, 10); c.fill();
    c.fillStyle = '#0b0c14';
    [[L * 0.28, -Wd / 2 - 2], [L * 0.28, Wd / 2 - 4], [-L * 0.30, -Wd / 2 - 2], [-L * 0.30, Wd / 2 - 4]].forEach(function (w) { rr(w[0] - 9, w[1], 18, 6, 2); c.fill(); });
    var g = c.createLinearGradient(0, -Wd / 2, 0, Wd / 2);
    g.addColorStop(0, shade(col, 0.25)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -0.3));
    c.fillStyle = g; rr(-L / 2, -Wd / 2, L, Wd, suv ? 9 : 14); c.fill();
    c.fillStyle = '#141a2e';
    c.beginPath(); c.moveTo(L * 0.10, -Wd * 0.36); c.lineTo(L * 0.26, -Wd * 0.30); c.lineTo(L * 0.26, Wd * 0.30); c.lineTo(L * 0.10, Wd * 0.36); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-L * 0.22, -Wd * 0.32); c.lineTo(-L * 0.34, -Wd * 0.27); c.lineTo(-L * 0.34, Wd * 0.27); c.lineTo(-L * 0.22, Wd * 0.32); c.closePath(); c.fill();
    c.fillStyle = shade(col, -0.08); rr(-L * 0.22, -Wd * 0.33, L * 0.32, Wd * 0.66, 6); c.fill();
    if (suv) { c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-L * 0.18, -Wd * 0.22); c.lineTo(L * 0.06, -Wd * 0.22); c.moveTo(-L * 0.18, Wd * 0.22); c.lineTo(L * 0.06, Wd * 0.22); c.stroke(); }
    c.fillStyle = '#fffbe0'; rr(L / 2 - 8, -Wd / 2 + 3, 6, 9, 2); c.fill(); rr(L / 2 - 8, Wd / 2 - 12, 6, 9, 2); c.fill();
    c.fillStyle = cr.braking ? '#ff2a2a' : '#a01820'; rr(-L / 2 + 1, -Wd / 2 + 3, 5, 10, 2); c.fill(); rr(-L / 2 + 1, Wd / 2 - 13, 5, 10, 2); c.fill();
    c.restore();
  }

  function drawWorld() {
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#1b2d21'; c.fillRect(0, 0, W, H);
    var s = clamp(Math.min(W, H) / 620, 0.7, 1.6) * (1 - Math.min(Math.abs(car.vf), 700) / 700 * 0.22);
    var shx = shake > 0.3 ? (Math.random() - 0.5) * shake : 0, shy = shake > 0.3 ? (Math.random() - 0.5) * shake : 0;
    c.translate(W / 2 + shx, H / 2 + shy); c.scale(s, s); c.translate(-cam.x, -cam.y);
    var vw = W / s / 2 + 80, vh = H / s / 2 + 80, x0 = cam.x - vw, x1 = cam.x + vw, y0 = cam.y - vh, y1 = cam.y + vh;

    c.fillStyle = '#2c3040'; c.fillRect(0, 0, WORLD, WORLD);
    c.strokeStyle = '#ff5a1f'; c.lineWidth = 12; c.strokeRect(-6, -6, WORLD + 12, WORLD + 12);

    c.strokeStyle = 'rgba(255,224,102,.55)'; c.lineWidth = 4; c.setLineDash([34, 28]);
    for (var i = 0; i <= CELLS; i++) {
      var ln = i * PITCH + ROAD / 2;
      if (ln > x0 && ln < x1) { c.beginPath(); c.moveTo(ln, Math.max(0, y0)); c.lineTo(ln, Math.min(WORLD, y1)); c.stroke(); }
      if (ln > y0 && ln < y1) { c.beginPath(); c.moveTo(Math.max(0, x0), ln); c.lineTo(Math.min(WORLD, x1), ln); c.stroke(); }
    }
    c.setLineDash([]);

    blocks.forEach(function (b) {
      if (b.x > x1 || b.x + BLOCK < x0 || b.y > y1 || b.y + BLOCK < y0) return;
      c.fillStyle = '#4d5368'; rr(b.x, b.y, BLOCK, BLOCK, 14); c.fill();
    });
    parks.forEach(function (b) {
      if (b.x > x1 || b.x + BLOCK < x0 || b.y > y1 || b.y + BLOCK < y0) return;
      c.fillStyle = '#2f6b3a'; rr(b.x + 6, b.y + 6, BLOCK - 12, BLOCK - 12, 12); c.fill();
    });

    // skid marks
    for (var k = 0; k < skids.length; k++) {
      var sk = skids[k]; if (sk.x < x0 || sk.x > x1 || sk.y < y0 || sk.y > y1) continue;
      c.fillStyle = 'rgba(8,8,14,' + (sk.l * 0.5).toFixed(2) + ')'; c.beginPath(); c.arc(sk.x, sk.y, 3.5, 0, 7); c.fill();
    }
    // coins
    for (var q = 0; q < coinsArr.length; q++) {
      var cn = coinsArr[q]; if (cn.x < x0 || cn.x > x1 || cn.y < y0 || cn.y > y1) continue;
      var sx = Math.abs(Math.cos(T * 3 + cn.p));
      c.fillStyle = '#ffcf33'; c.beginPath(); c.ellipse(cn.x, cn.y, 11 * sx + 1, 11, 0, 0, 7); c.fill();
      c.strokeStyle = '#b8860b'; c.lineWidth = 2; c.stroke();
    }
    // particles
    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p], f = pt.l / pt.m;
      c.fillStyle = pt.col + (f * 0.7).toFixed(2) + ')'; c.beginPath(); c.arc(pt.x, pt.y, pt.r * (pt.col.indexOf('210') > -1 ? 2 - f : f + 0.3), 0, 7); c.fill();
    }
    drawTop(car, car.color);

    // buildings
    for (var b2 = 0; b2 < bld.length; b2++) {
      var b = bld[b2]; if (b.x > x1 || b.x + b.w < x0 || b.y > y1 || b.y + b.h < y0) continue;
      c.fillStyle = 'rgba(0,0,0,.28)'; rr(b.x + b.hh, b.y + b.hh, b.w, b.h, 8); c.fill();
      c.fillStyle = b.c; rr(b.x, b.y, b.w, b.h, 8); c.fill();
      c.fillStyle = shade(b.c, 0.35); rr(b.x + 10, b.y + 10, b.w - 20, b.h - 20, 6); c.fill();
      c.fillStyle = shade(b.c, -0.25); rr(b.x + b.w * 0.58, b.y + b.h * 0.2, b.w * 0.22, b.h * 0.18, 3); c.fill();
      rr(b.x + b.w * 0.2, b.y + b.h * 0.6, b.w * 0.18, b.h * 0.18, 3); c.fill();
    }
    // trees
    for (var t = 0; t < trees.length; t++) {
      var tr = trees[t]; if (tr.x < x0 || tr.x > x1 || tr.y < y0 || tr.y > y1) continue;
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.arc(tr.x + 5, tr.y + 6, tr.r, 0, 7); c.fill();
      c.fillStyle = '#2e8f45'; c.beginPath(); c.arc(tr.x, tr.y, tr.r, 0, 7); c.fill();
      c.fillStyle = '#44b85f'; c.beginPath(); c.arc(tr.x - tr.r * 0.25, tr.y - tr.r * 0.25, tr.r * 0.6, 0, 7); c.fill();
    }
  }

  function drawHUD() {
    // minimap
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var ms = 130 / WORLD, mx = W - 142, my = 66;
    if (H > 360) {
      c.globalAlpha = 0.92; c.drawImage(mm, mx, my); c.globalAlpha = 1;
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.strokeRect(mx, my, 130, 130);
      c.fillStyle = '#ffcf33';
      for (var i = 0; i < coinsArr.length; i++) c.fillRect(mx + coinsArr[i].x * ms - 1, my + coinsArr[i].y * ms - 1, 2.5, 2.5);
      c.save(); c.translate(mx + car.x * ms, my + car.y * ms); c.rotate(car.a);
      c.fillStyle = '#ff3d6e'; c.beginPath(); c.moveTo(6, 0); c.lineTo(-4, -4); c.lineTo(-4, 4); c.closePath(); c.fill(); c.restore();
    }
    $('spd').firstChild.nodeValue = Math.round(Math.abs(car.vf) * 0.42);
    $('nf').style.width = car.nrg + '%';
    $('coins').textContent = save.coins;
    var d = $('drift');
    if (driftPts > 3) { d.textContent = 'DRIFT ' + Math.floor(driftPts); d.style.opacity = 1; }
    else d.style.opacity = 0;
  }

  /* ================= LOOP ================= */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { persist(); if (AC) try { AC.suspend(); } catch (e) {} }
    else if (AC) try { AC.resume(); } catch (e) {}
  });

  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; T += dt;
    if (mode === 'garage') {
      selF += (sel - selF) * Math.min(1, dt * 9);
      if (Math.abs(sel - selF) < 0.001) selF = sel;
      drawGarage();
    } else {
      update(dt); drawWorld(); drawHUD();
    }
  }

  buildWorld(); resize(); refreshGarage();
  requestAnimationFrame(frame);
})();
</script>
