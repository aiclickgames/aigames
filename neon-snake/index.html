<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Snake</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d0f1c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none}
  #wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
  #hud{display:flex;gap:22px;font-weight:800;font-size:1rem;letter-spacing:.02em}
  #hud span b{color:#a99bff}
  #board{position:relative}
  canvas{display:block;background:#10132a;border-radius:14px;box-shadow:0 0 34px rgba(124,92,255,.35),inset 0 0 0 2px rgba(255,255,255,.06)}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(8,9,20,.72);border-radius:14px;text-align:center;cursor:pointer;padding:12px}
  #ov h1{margin:0;font-size:clamp(1.6rem,6vw,2.4rem);color:#7cffc4;text-shadow:0 0 18px rgba(124,255,196,.6)}
  #ov p{margin:0;color:#9aa0c3;font-weight:700}
  #ov .btn{margin-top:8px;border:0;border-radius:999px;background:#7c5cff;color:#fff;font:inherit;font-weight:800;font-size:1.1rem;padding:10px 38px;box-shadow:0 8px 24px rgba(124,92,255,.45);cursor:pointer}
  #pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px}
  #pad button{border:0;border-radius:12px;background:#20243f;color:#fff;font-size:1.3rem;font-weight:800}
  #pad button:active{background:#7c5cff}
  #pad .u{grid-column:2;grid-row:1}
  #pad .l{grid-column:1;grid-row:2}
  #pad .d{grid-column:2;grid-row:2}
  #pad .r{grid-column:3;grid-row:2}
  @media (pointer:coarse){#pad{display:grid}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>Score: <b id="sc">0</b></span><span>Best: <b id="bs">0</b></span></div>
  <div id="board">
    <canvas id="cv"></canvas>
    <div id="ov">
      <h1 id="ovt">Neon Snake</h1>
      <p id="ovp">Eat the glowing food. Don't hit the walls or yourself.</p>
      <p>Arrow keys / WASD / swipe to steer &middot; Space to pause</p>
      <button class="btn" id="go" type="button">Play</button>
    </div>
  </div>
  <div id="pad">
    <button class="u" data-d="u" aria-label="Up">&#9650;</button>
    <button class="l" data-d="l" aria-label="Left">&#9664;</button>
    <button class="d" data-d="d" aria-label="Down">&#9660;</button>
    <button class="r" data-d="r" aria-label="Right">&#9654;</button>
  </div>
</div>

<script>
(function () {
  var N = 20;                       // grid is N x N
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var ov = document.getElementById('ov'), ovt = document.getElementById('ovt'), ovp = document.getElementById('ovp'), go = document.getElementById('go');
  var scEl = document.getElementById('sc'), bsEl = document.getElementById('bs');
  var cell = 20, snake, dir, queue, food, score, best = 0, timer = null, state = 'idle'; // idle | run | pause | over

  try { best = parseInt(localStorage.getItem('neonsnake_best'), 10) || 0; } catch (e) {}
  bsEl.textContent = best;

  var DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };

  function resize() {
    var pad = document.getElementById('pad');
    var padH = getComputedStyle(pad).display === 'none' ? 0 : 120;
    var size = Math.min(window.innerWidth - 16, window.innerHeight - 70 - padH, 640);
    size = Math.max(200, size);
    cell = Math.floor(size / N);
    cv.width = cv.height = cell * N;
    draw();
  }

  function reset() {
    var m = Math.floor(N / 2);
    snake = [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }];
    dir = 'r'; queue = [];
    score = 0; scEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      var taken = false;
      for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
      if (!taken) free.push({ x: x, y: y });
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function speed() { return Math.max(65, 140 - score * 3); }

  function start() {
    reset();
    state = 'run';
    ov.style.display = 'none';
    clearTimeout(timer);
    loop();
  }

  function loop() {
    if (state !== 'run') return;
    step();
    if (state === 'run') timer = setTimeout(loop, speed());
  }

  function turn(d) {
    if (state === 'idle' || state === 'over') return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    var opp = { u: 'd', d: 'u', l: 'r', r: 'l' };
    if (d === last || d === opp[last]) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var v = DIRS[dir], head = { x: snake[0].x + v[0], y: snake[0].y + v[1] };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
    var willEat = food && head.x === food.x && head.y === food.y;
    var body = willEat ? snake : snake.slice(0, -1);   // tail moves away unless we grow
    for (var i = 0; i < body.length; i++) if (body[i].x === head.x && body[i].y === head.y) return die();
    snake.unshift(head);
    if (willEat) {
      score++; scEl.textContent = score;
      if (score > best) { best = score; bsEl.textContent = best; try { localStorage.setItem('neonsnake_best', best); } catch (e) {} }
      placeFood();
      if (!food) return win();
    } else snake.pop();
    draw();
  }

  function die() {
    state = 'over'; draw();
    ovt.textContent = 'Game Over';
    ovp.textContent = 'Score: ' + score + '  \u2022  Best: ' + best;
    go.textContent = 'Play Again';
    ov.style.display = 'flex';
  }
  function win() {
    state = 'over'; draw();
    ovt.textContent = 'You Win!';
    ovp.textContent = 'You filled the whole board!';
    go.textContent = 'Play Again';
    ov.style.display = 'flex';
  }
  function pause(on) {
    if (on && state === 'run') {
      state = 'pause'; clearTimeout(timer);
      ovt.textContent = 'Paused'; ovp.textContent = 'Press Space or tap to continue';
      go.textContent = 'Resume'; ov.style.display = 'flex';
    } else if (!on && state === 'pause') {
      state = 'run'; ov.style.display = 'none'; loop();
    }
  }

  function draw() {
    var w = cv.width;
    cx.clearRect(0, 0, w, w);
    // faint grid
    cx.strokeStyle = 'rgba(255,255,255,.035)'; cx.lineWidth = 1;
    for (var i = 1; i < N; i++) {
      cx.beginPath(); cx.moveTo(i * cell, 0); cx.lineTo(i * cell, w); cx.stroke();
      cx.beginPath(); cx.moveTo(0, i * cell); cx.lineTo(w, i * cell); cx.stroke();
    }
    if (!snake) return;
    // food
    if (food) {
      cx.shadowColor = '#ff4d8d'; cx.shadowBlur = cell;
      cx.fillStyle = '#ff4d8d';
      cx.beginPath(); cx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.34, 0, Math.PI * 2); cx.fill();
    }
    // snake
    cx.shadowColor = '#7cffc4'; cx.shadowBlur = cell * 0.7;
    for (var k = snake.length - 1; k >= 0; k--) {
      var t = 1 - k / Math.max(snake.length, 8) * 0.55;
      cx.fillStyle = k === 0 ? '#e8fff5' : 'rgba(124,255,196,' + t.toFixed(2) + ')';
      var p = k === 0 ? 1 : 2;
      cx.beginPath();
      if (cx.roundRect) cx.roundRect(snake[k].x * cell + p, snake[k].y * cell + p, cell - p * 2, cell - p * 2, cell * 0.3);
      else cx.rect(snake[k].x * cell + p, snake[k].y * cell + p, cell - p * 2, cell - p * 2);
      cx.fill();
    }
    cx.shadowBlur = 0;
  }

  // ---- input ----
  var KEYS = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r', W: 'u', S: 'd', A: 'l', D: 'r' };
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (state === 'run') pause(true); else if (state === 'pause') pause(false); else start();
      return;
    }
    var d = KEYS[e.key];
    if (d) { e.preventDefault(); if (state === 'idle' || state === 'over') start(); turn(d); }
  });
  go.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state === 'pause') pause(false); else start();
  });
  ov.addEventListener('click', function () { if (state === 'pause') pause(false); else start(); });
  Array.prototype.forEach.call(document.querySelectorAll('#pad button'), function (b) {
    b.addEventListener('touchstart', function (e) { e.preventDefault(); turn(b.getAttribute('data-d')); }, { passive: false });
    b.addEventListener('mousedown', function () { turn(b.getAttribute('data-d')); });
  });

  // swipe on the board
  var sx = 0, sy = 0;
  cv.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  }, { passive: true });

  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(true); });
  window.addEventListener('resize', resize);

  reset(); resize();
})();
</script>
</body>
</html>
